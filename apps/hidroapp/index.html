<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>HidroApp Mobile 1.2</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#0ea5e933,transparent 30%),linear-gradient(#07111f,#071827);color:#eef8ff;font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.brand span{color:#38bdf8}.pill{background:#10243a;border:1px solid #1d3a56;border-radius:999px;padding:7px 10px;color:#9bdcff;font-size:12px}.card{background:#0d2034;border:1px solid #1d3a56;border-radius:22px;padding:18px;margin:13px 0;box-shadow:0 16px 40px #0004}.hero{text-align:center;padding:24px 18px}.drop{font-size:58px}.big{font-size:46px;font-weight:1000;letter-spacing:-2px}.muted{color:#8ea8bf}.track{height:14px;background:#071421;border-radius:999px;overflow:hidden;margin:14px 0}.fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);width:0;transition:.4s}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:1px solid #245273;background:#102b44;color:#e8f8ff;border-radius:14px;padding:13px 8px;font-weight:800}.btn.primary{background:linear-gradient(135deg,#0284c7,#38bdf8);border:0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}input{width:100%;background:#071421;border:1px solid #245273;border-radius:12px;color:#fff;padding:12px;font:inherit}.history{display:grid;gap:8px}.day{display:flex;justify-content:space-between;padding:9px 11px;background:#091a2b;border-radius:12px}.done{color:#67e8f9}.danger{color:#fca5a5}.small{font-size:12px}.reset{background:transparent;color:#fca5a5;border:1px solid #7f1d1d}
</style></head><body><div class="app"><div class="top"><div class="brand">💧 Hidro<span>App</span></div><div class="pill">v1.2 Web</div></div><section class="card hero"><div class="drop">💧</div><div class="muted">Hoje</div><div class="big"><span id="today">0</span> ml</div><div class="muted">Meta: <b id="goal">2200</b> ml</div><div class="track"><div class="fill" id="fill"></div></div><div id="pct">0%</div></section><section class="card"><b>Adicionar água</b><div class="grid" style="margin-top:12px"><button class="btn" onclick="add(200)">+200 ml</button><button class="btn" onclick="add(300)">+300 ml</button><button class="btn" onclick="add(500)">+500 ml</button></div><div class="row" style="margin-top:8px"><input id="custom" type="number" inputmode="numeric" placeholder="Quantidade em ml"><button class="btn primary" onclick="addCustom()">Adicionar</button></div></section><section class="card"><b>Meta inteligente</b><p class="muted small">Use 35 ml por kg ou defina uma meta manual.</p><div class="row"><input id="weight" type="number" placeholder="Peso (kg)"><button class="btn" onclick="calcGoal()">35 ml/kg</button></div><div class="row" style="margin-top:8px"><input id="manualGoal" type="number" placeholder="Meta manual (ml)"><button class="btn" onclick="setGoalManual()">Salvar meta</button></div></section><section class="card"><b>Lembrete diário</b><p class="muted small">Enquanto o app estiver aberto, ele avisa no horário escolhido. Em navegadores compatíveis, usa notificação do sistema.</p><div class="row"><input id="reminder" type="time" value="15:00"><button class="btn" onclick="enableReminder()">Ativar</button></div></section><section class="card"><b>Últimos 7 dias</b><div class="history" id="history"></div></section><button class="btn reset" onclick="resetToday()">Zerar consumo de hoje</button></div><script>
const KEY='hidroapp.web.v12';let st=JSON.parse(localStorage.getItem(KEY)||'null')||{goal:2200,days:{},reminder:'15:00'};const dk=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(KEY,JSON.stringify(st));render()}function today(){return st.days[dk()]||0}function add(v){st.days[dk()]=today()+Math.max(0,Number(v)||0);save()}function addCustom(){add(document.getElementById('custom').value);document.getElementById('custom').value=''}function calcGoal(){const w=Number(document.getElementById('weight').value);if(w>0){st.goal=Math.round(w*35);save()}}function setGoalManual(){const g=Number(document.getElementById('manualGoal').value);if(g>0){st.goal=Math.round(g);save()}}async function enableReminder(){st.reminder=document.getElementById('reminder').value||'15:00';if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();save();alert('Lembrete ativado para '+st.reminder)}function checkReminder(){if(!st.reminder)return;const now=new Date(), k=dk()+'@'+st.reminder;if(localStorage.getItem(k))return;if(now.toTimeString().slice(0,5)>=st.reminder&&today()<st.goal){localStorage.setItem(k,'1');if('Notification'in window&&Notification.permission==='granted'){navigator.serviceWorker?.ready.then(r=>r.showNotification('HidroApp',{body:'Hora de beber água 💧',tag:'hidro-'+dk(),data:{url:location.href}})).catch(()=>{})}}}function resetToday(){if(confirm('Zerar o consumo de hoje?')){st.days[dk()]=0;save()}}function render(){const v=today(),p=Math.min(100,Math.round(v/st.goal*100));todayEl=document.getElementById('today');todayEl.textContent=v;document.getElementById('goal').textContent=st.goal;document.getElementById('fill').style.width=p+'%';document.getElementById('pct').textContent=p+'% da meta';document.getElementById('reminder').value=st.reminder||'15:00';let h='';for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10),val=st.days[k]||0;h+=`<div class="day"><span>${i===0?'Hoje':d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'})}</span><b class="${val>=st.goal?'done':''}">${val} ml</b></div>`}document.getElementById('history').innerHTML=h}render();setInterval(checkReminder,30000);setTimeout(checkReminder,1000);
</script><script src="../pwa-install.js"></script></body></html>
