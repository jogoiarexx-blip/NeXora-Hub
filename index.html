<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora Hub</title>
<meta name="description" content="Nexora Hub — livros, apps e jogos num só lugar.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/favicon.png">
<script defer src="js/data-livros.js"></script>
<script defer src="js/data-jogos.js"></script>
<script defer src="js/data-apps.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>

<header>
  <img class="brand-logo" src="assets/logo.png" alt="Nexora Hub — livros, apps e jogos" width="1254" height="1254">
</header>

<section id="banner">
  <a id="merchLink" href="https://example.com" target="_blank" rel="noopener">
    <span class="banner-tag" id="bannerTag">promo</span>
    <img id="merchImg" src="assets/banner-placeholder.png" alt="Banner promocional">
  </a>
</section>

<div class="type-tabs" id="typeTabs"></div>

<div class="controls">
  <input id="search" placeholder="buscar...">
  <div class="filters" id="filters"></div>
</div>

<div id="games"></div>
<p id="emptyState">nada encontrado com esse filtro.</p>

<footer>
  <img class="brand-mark" src="assets/logo.png" alt="Nexora Hub">
  <p>feito por <span>Nexora Hub</span> &middot; livros, apps e jogos &middot; prateleira sempre em construção</p>
</footer>

</body>
</html>
