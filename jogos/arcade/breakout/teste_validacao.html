<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>🔍 Teste de Validação - Modern Breakout</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #0f0;
            padding: 20px;
        }
        h1 {
            color: #00d2ff;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .warning { color: #ff0; }
        #log {
            background: #1a1a2e;
            padding: 15px;
            border: 2px solid #00d2ff;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        .test-item {
            margin: 5px 0;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 Modern Breakout - Teste de Validação</h1>
    <div id="log"></div>
    
    <script>
        const log = document.getElementById('log');
        let testsPassed = 0;
        let testsFailed = 0;
        
        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-item ${type}`;
            div.innerHTML = msg;
            log.appendChild(div);
            console.log(msg);
        }
        
        function testPass(msg) {
            addLog('✅ ' + msg, 'success');
            testsPassed++;
        }
        
        function testFail(msg) {
            addLog('❌ ' + msg, 'error');
            testsFailed++;
        }
        
        function testWarn(msg) {
            addLog('⚠️ ' + msg, 'warning');
        }
        
        // Captura erros globais
        window.onerror = function(msg, url, line, col, error) {
            testFail(`Erro global: ${msg} (linha ${line})`);
            return true;
        };
        
        addLog('=== INICIANDO TESTES ===', 'info');
    </script>
    
    <!-- TESTE 1: Config -->
    <script src="config.js"></script>
    <script>
        if (typeof CONFIG !== 'undefined') {
            testPass('CONFIG carregado');
            if (CONFIG.SCREEN && CONFIG.PADDLE && CONFIG.BALL && CONFIG.BRICKS) {
                testPass('CONFIG possui todas as seções principais');
            } else {
                testFail('CONFIG está incompleto');
            }
        } else {
            testFail('CONFIG não foi carregado');
        }
    </script>
    
    <!-- TESTE 2: Game Namespace -->
    <script>
        const canvas = document.createElement('canvas');
        canvas.width = CONFIG.SCREEN.WIDTH;
        canvas.height = CONFIG.SCREEN.HEIGHT;
        
        window.Game = {
            ctx: canvas.getContext('2d'),
            canvas: canvas,
            width: CONFIG.SCREEN.WIDTH,
            height: CONFIG.SCREEN.HEIGHT,
            state: 'MENU',
            initialized: false,
            data: {
                score: 0,
                coins: 0,
                level: 1,
                lives: 3,
                maxLives: 3,
                highScore: 0,
                selectedSkin: 'default'
            },
            economy: null,
            particles: null,
            brickManager: null,
            paddle: null,
            ball: null,
            ui: null,
            hud: null,
            skinManager: null
        };
        
        if (window.Game && window.Game.ctx && window.Game.data) {
            testPass('Game namespace criado com sucesso');
        } else {
            testFail('Game namespace falhou');
        }
    </script>
    
    <!-- TESTE 3: Carregar todas as classes -->
    <script src="audio.js"></script>
    <script>
        if (typeof AudioManager === 'function') {
            testPass('AudioManager carregado');
        } else {
            testFail('AudioManager não encontrado');
        }
    </script>
    
    <script src="stats.js"></script>
    <script>
        if (typeof Statistics === 'function') {
            testPass('Statistics carregado');
        } else {
            testFail('Statistics não encontrado');
        }
    </script>
    
    <script src="achievements.js"></script>
    <script>
        if (typeof AchievementSystem === 'function') {
            testPass('AchievementSystem carregado');
        } else {
            testFail('AchievementSystem não encontrado');
        }
    </script>
    
    <script src="leaderboard.js"></script>
    <script>
        if (typeof Leaderboard === 'function') {
            testPass('Leaderboard carregado');
        } else {
            testFail('Leaderboard não encontrado');
        }
    </script>
    
    <script src="levelgen.js"></script>
    <script>
        if (typeof LevelGenerator === 'function') {
            testPass('LevelGenerator carregado');
        } else {
            testFail('LevelGenerator não encontrado');
        }
    </script>
    
    <script src="economy.js"></script>
    <script>
        if (typeof Economy === 'function') {
            testPass('Economy carregado');
        } else {
            testFail('Economy não encontrado');
        }
    </script>
    
    <script src="particles.js"></script>
    <script>
        if (typeof ParticleSystem === 'function') {
            testPass('ParticleSystem carregado');
        } else {
            testFail('ParticleSystem não encontrado');
        }
    </script>
    
    <script src="powerups.js"></script>
    <script>
        if (typeof PowerUpManager === 'function') {
            testPass('PowerUpManager carregado');
        } else {
            testFail('PowerUpManager não encontrado');
        }
    </script>
    
    <script src="skins_manager.js"></script>
    <script>
        if (typeof SkinManager === 'function') {
            testPass('SkinManager carregado');
        } else {
            testFail('SkinManager não encontrado');
        }
    </script>
    
    <script src="paddle.js"></script>
    <script>
        if (typeof Paddle === 'function') {
            testPass('Paddle carregado');
        } else {
            testFail('Paddle não encontrado');
        }
    </script>
    
    <script src="ball.js"></script>
    <script>
        if (typeof Ball === 'function') {
            testPass('Ball carregado');
        } else {
            testFail('Ball não encontrado');
        }
    </script>
    
    <script src="bricks.js"></script>
    <script>
        if (typeof BrickManager === 'function') {
            testPass('BrickManager carregado');
        } else {
            testFail('BrickManager não encontrado');
        }
    </script>
    
    <script src="hud.js"></script>
    <script>
        if (typeof HUD === 'function') {
            testPass('HUD carregado');
        } else {
            testFail('HUD não encontrado');
        }
    </script>
    
    <script src="ui.js"></script>
    <script>
        if (typeof UI === 'function') {
            testPass('UI carregado');
        } else {
            testFail('UI não encontrado');
        }
    </script>
    
    <script src="loop.js"></script>
    <script>
        if (typeof initializeGame === 'function') {
            testPass('loop.js carregado e initializeGame definido');
        } else {
            testFail('loop.js não carregou corretamente');
        }
    </script>
    
    <!-- TESTE 4: Inicialização -->
    <script>
        addLog('=== TESTANDO INICIALIZAÇÃO ===', 'info');
        
        try {
            const success = initializeGame();
            if (success) {
                testPass('Jogo inicializado com sucesso!');
            } else {
                testFail('Inicialização retornou false');
            }
        } catch(e) {
            testFail('Erro na inicialização: ' + e.message);
        }
        
        // Resumo
        addLog('=== RESUMO DOS TESTES ===', 'info');
        addLog(`✅ Testes passados: ${testsPassed}`, 'success');
        if (testsFailed > 0) {
            addLog(`❌ Testes falhos: ${testsFailed}`, 'error');
        }
        
        const total = testsPassed + testsFailed;
        const percent = ((testsPassed / total) * 100).toFixed(1);
        
        if (testsFailed === 0) {
            addLog(`🎉 TODOS OS TESTES PASSARAM! (${testsPassed}/${total} - ${percent}%)`, 'success');
            addLog('✅ O jogo está pronto para ser executado!', 'success');
        } else {
            addLog(`⚠️ ${percent}% dos testes passaram (${testsPassed}/${total})`, 'warning');
            addLog('❌ Existem problemas que precisam ser corrigidos', 'error');
        }
    </script>
</body>
</html>
