<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo Exemplo — Nexora Hub</title>
<link rel="stylesheet" href="../../css/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
  .box{max-width:440px}
  .box .tag{display:inline-block;margin-bottom:14px}
  .box h1{font-family:var(--font-body);font-size:28px;margin:0 0 10px}
  .box p{color:var(--text-dim);font-size:14px;line-height:1.6;margin:0 0 22px}
  .box a{font-family:var(--font-mono);font-size:12px;color:var(--amber);border:1px solid var(--amber);border-radius:5px;padding:9px 16px;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <span class="tag" style="border-color:var(--amber);color:var(--amber)">template</span>
    <h1>Jogo Exemplo</h1>
    <p>Use esta pasta como base: duplique <code>jogos/exemplo</code>, renomeie e troque o conteúdo pelo seu jogo novo. Depois adicione um objeto em <code>GAMES</code> no js/app.js apontando pra ela.</p>
    <a href="../../index.html">&larr; voltar pra Nexora Hub</a>
  </div>
</body>
</html>
