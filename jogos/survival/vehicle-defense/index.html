/* ===== EFFECTS.JS ===== */
// ============================================================
// effects.js — Partículas, explosões, screen shake, textos
// ============================================================

const Effects = (() => {
  // Pool de partículas para evitar GC
  const MAX_PARTICLES = 400;
  const particles = [];
  const floatingTexts = [];
  let shakeTime = 0, shakeStrength = 0;
  let flashAlpha = 0;

  // ── Partícula individual ─────────────────────────────────
  function spawnParticle(x, y, opts = {}) {
    if (particles.length >= MAX_PARTICLES) return;
    const angle = opts.angle !== undefined ? opts.angle : Math.random() * Math.PI * 2;
    const speed = opts.speed !== undefined ? opts.speed : (Math.random() * 120 + 40);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed * (opts.spreadX || 1),
      vy: Math.sin(angle) * speed * (opts.spreadY || 1),
      life: 1,
      decay: opts.decay || (Math.random() * 1.5 + 1.0),
      size: opts.size || (Math.random() * 4 + 2),
      color: opts.color || '#ff8800',
      gravity: opts.gravity !== undefined ? opts.gravity : 200,
      alpha: 1,
      shrink: opts.shrink !== false,
      glow: opts.glow || false,
    });
  }

  // ── Emissores prontos ────────────────────────────────────

  function muzzleFlash(x, y, angle) {
    // Flash central brilhante
    for (let i = 0; i < 3; i++) {
      spawnParticle(x, y, {
        angle: angle + (Math.random() - 0.5) * 0.3,
        speed: Math.random() * 220 + 100,
        size: Math.random() * 2.5 + 1,
        color: '#ffffff', decay: 6, gravity: 0, glow: true,
      });
    }
    // Faíscas laranja
    for (let i = 0; i < 6; i++) {
      spawnParticle(x, y, {
        angle: angle + (Math.random() - 0.5) * 0.8,
        speed: Math.random() * 150 + 50,
        size: Math.random() * 2 + 1,
        color: i < 3 ? '#ffdd44' : '#ff8800', decay: 5, gravity: 80, glow: true,
      });
    }
    // Fumaça de disparo
    spawnParticle(x, y, { angle, speed: 50, size: 10, color: 'rgba(180,180,160,0.5)', decay: 1.8, gravity: -20, shrink: true });
    spawnParticle(x, y, { angle: angle + 0.2, speed: 35, size: 7, color: 'rgba(150,140,120,0.4)', decay: 1.5, gravity: -15, shrink: true });
  }

  function bulletHit(x, y) {
    // Faíscas de impacto
    for (let i = 0; i < 8; i++) {
      spawnParticle(x, y, {
        speed: Math.random() * 140 + 40,
        size: Math.random() * 3 + 1,
        color: ['#ff5544','#ff9900','#ffcc00','#ffffff'][Math.floor(Math.random()*4)],
        decay: 4, gravity: 200, glow: i < 3,
      });
    }
    // Pequeno flash branco
    spawnParticle(x, y, { speed: 0, size: 6, color: 'rgba(255,255,255,0.8)', decay: 10, gravity: 0, glow: true });
  }

  function explosion(x, y, radius = 1) {
    // Núcleo brilhante
    for (let i = 0; i < 3; i++) {
      spawnParticle(x, y, {
        speed: Math.random() * 30,
        size: (8 + Math.random() * 4) * radius,
        color: i === 0 ? '#ffffff' : i === 1 ? '#ffee88' : '#ff8800',
        decay: 5 + i * 2, gravity: 0, glow: true, shrink: true,
      });
    }
    // Fragmentos de fogo
    const count = Math.floor(22 * radius);
    for (let i = 0; i < count; i++) {
      const t = Math.random();
      spawnParticle(x, y, {
        speed: Math.random() * (250 * radius) + 80,
        size: Math.random() * (5 * radius) + 1.5,
        color: t < 0.3 ? '#ffffff' : t < 0.55 ? '#ffee55' : t < 0.75 ? '#ff8800' : '#ff3300',
        decay: 1.2 + Math.random() * 1.5, gravity: 100 + Math.random() * 80, glow: t < 0.5,
      });
    }
    // Fumaça volumétrica
    for (let i = 0; i < 8; i++) {
      spawnParticle(x + (Math.random()-0.5)*20*radius, y + (Math.random()-0.5)*10*radius, {
        speed: Math.random() * 70 + 15,
        size: Math.random() * (22 * radius) + 10,
        color: `rgba(${50+Math.random()*50|0},${40+Math.random()*30|0},${30+Math.random()*20|0},0.65)`,
        decay: 0.6 + Math.random()*0.4, gravity: -35, shrink: true,
      });
    }
    // Detritos escuros
    for (let i = 0; i < Math.floor(8 * radius); i++) {
      spawnParticle(x, y, {
        speed: Math.random() * 180 * radius + 60,
        size: Math.random() * 4 + 2,
        color: '#222222', decay: 1.0, gravity: 300,
      });
    }
    shake(radius * 8, radius * 0.35);
    flash(0.15 * Math.min(radius, 2));
  }

  function bloodSplat(x, y) {
    for (let i = 0; i < 12; i++) {
      spawnParticle(x, y, {
        speed: Math.random() * 160 + 50,
        size: Math.random() * 5 + 1.5,
        color: `hsl(${345 + Math.random()*25|0},${85+Math.random()*10|0}%,${25+Math.random()*20|0}%)`,
        decay: 1.8 + Math.random(), gravity: 240 + Math.random()*80,
      });
    }
    // Gotícula central
    spawnParticle(x, y, { speed: 20, size: 8, color: 'rgba(180,0,20,0.7)', decay: 1.5, gravity: 280, shrink: true });
  }

  function coinPop(x, y) {
    for (let i = 0; i < 8; i++) {
      spawnParticle(x, y, {
        speed: Math.random() * 100 + 40,
        size: Math.random() * 4 + 3,
        color: i < 4 ? '#ffdd00' : '#ffaa00',
        decay: 2.0 + Math.random(), gravity: 350, glow: true,
      });
    }
    // Brilho
    spawnParticle(x, y, { speed: 0, size: 12, color: 'rgba(255,220,0,0.6)', decay: 6, gravity: 0, glow: true, shrink: true });
  }

  function engineSpark(x, y) {
    for (let i = 0; i < 2; i++) {
      spawnParticle(x, y, {
        angle: Math.PI + (Math.random() - 0.5) * 0.6,
        speed: Math.random() * 100 + 30,
        size: Math.random() * 3 + 1,
        color: Math.random() > 0.4 ? '#ff7700' : '#ffcc00',
        decay: 3.5, gravity: 150, glow: Math.random() > 0.5,
      });
    }
  }

  // [MELHORIA 6] Efeito de loot dropando — faíscas douradas para coin, verdes para repair
  function lootDrop(x, y, type) {
    const color = type === 'coin' ? '#ffdd00' : '#44ff88';
    for (let i = 0; i < 8; i++) {
      spawnParticle(x, y, {
        speed: Math.random() * 60 + 20,
        size: Math.random() * 4 + 2,
        color,
        decay: 2,
        gravity: 120,
        glow: true,
      });
    }
  }

  // ── Screen shake ─────────────────────────────────────────
  function shake(strength = 8, duration = 0.2) {
    shakeStrength = Math.max(shakeStrength, strength);
    shakeTime = Math.max(shakeTime, duration);
  }

  function flash(alpha = 0.4) {
    flashAlpha = Math.max(flashAlpha, alpha);
  }

  // ── Texto flutuante ──────────────────────────────────────
  function floatText(x, y, text, color = '#ffffff', size = 16) {
    floatingTexts.push({ x, y, text, color, size, life: 1, vy: -60, alpha: 1 });
  }

  // ── Update & Draw ────────────────────────────────────────
  function update(dt) {
    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt;
      p.vx *= (1 - dt * 2);
      p.life -= p.decay * dt;
      p.alpha = Math.max(0, p.life);
      if (p.shrink) p.size *= (1 - dt * p.decay * 0.5);
      if (p.life <= 0 || p.size < 0.3) particles.splice(i, 1);
    }
    // Textos
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const t = floatingTexts[i];
      t.y += t.vy * dt;
      t.vy += 20 * dt; // desacelera
      t.life -= 1.2 * dt;
      t.alpha = Math.max(0, t.life);
      if (t.life <= 0) floatingTexts.splice(i, 1);
    }
    // Shake
    if (shakeTime > 0) { shakeTime -= dt; if (shakeTime < 0) { shakeTime = 0; shakeStrength = 0; } }
    // Flash
    if (flashAlpha > 0) flashAlpha -= dt * 3;
  }

  function draw(ctx, cameraX, W, H) {
    ctx.save();
    // Partículas (espaço de mundo)
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      if (p.glow) { ctx.shadowBlur = p.size * 3; ctx.shadowColor = p.color; }
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - cameraX, p.y, Math.max(0.1, p.size), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // Textos flutuantes (também em espaço de mundo)
    ctx.save();
    for (const t of floatingTexts) {
      ctx.globalAlpha = Math.max(0, t.alpha);
      ctx.fillStyle = t.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.lineWidth = 3;
      ctx.font = `bold ${t.size}px 'Orbitron, Arial'`;
      ctx.textAlign = 'center';
      const sx = t.x - cameraX;
      ctx.strokeText(t.text, sx, t.y);
      ctx.fillText(t.text, sx, t.y);
    }
    ctx.restore();

    // Flash vermelho (espaço de tela)
    if (flashAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, flashAlpha);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  function getShakeOffset() {
    if (shakeTime <= 0) return { x: 0, y: 0 };
    const t = shakeStrength * (shakeTime / 0.3);
    return { x: (Math.random() - 0.5) * t, y: (Math.random() - 0.5) * t };
  }

  return { spawnParticle, muzzleFlash, bulletHit, explosion, bloodSplat, coinPop, engineSpark, lootDrop, shake, flash, floatText, update, draw, getShakeOffset };
})();


/* ===== PROGRESSION.JS ===== */
// ============================================================
// progression.js — Progressão permanente entre partidas
// ============================================================

const Progression = (() => {
  const STORAGE_KEY = 'vd_progression_v2';

  const PERK_DEFS = [
    // Fase 1 — sempre disponível
    {
      id: 'armor', label: 'Blindagem Extra', icon: '🛡',
      desc: '+100 HP máximo por nível',
      unlockPhase: 1, maxLevel: 5, cost: [25, 50, 80, 120, 180],
      apply(vehicle, level) { vehicle.maxHp += 100 * level; vehicle.hp = vehicle.maxHp; },
    },
    {
      id: 'engine', label: 'Motor Reforçado', icon: '⚙️',
      desc: '+12px/s velocidade base por nível',
      unlockPhase: 1, maxLevel: 5, cost: [30, 55, 90, 140, 200],
      apply(vehicle, level) { vehicle.baseSpeed += 12 * level; },
    },
    // Fase 2
    {
      id: 'starter_weapon', label: 'Arsenal Inicial', icon: '🔫',
      desc: 'Começa com uma arma extra equipada',
      unlockPhase: 2, maxLevel: 3, cost: [60, 120, 200],
      apply(vehicle, level) {
        const types = ['sniper', 'shotgun', 'rocket'];
        for (let i = 0; i < level; i++) vehicle.addWeapon(types[i]);
      },
    },
    {
      id: 'fire_rate', label: 'Câmara de Combustão', icon: '🔥',
      desc: '-10% tempo de recarga por nível',
      unlockPhase: 2, maxLevel: 4, cost: [40, 75, 120, 180],
      apply(vehicle, level) {
        for (const w of vehicle.weapons) w.fireRate *= Math.pow(0.9, level);
      },
    },
    // Fase 3
    {
      id: 'crit', label: 'Mira Aprimorada', icon: '🎯',
      desc: '+10% chance de crítico (2× dano)',
      unlockPhase: 3, maxLevel: 4, cost: [50, 100, 160, 240],
      apply(vehicle, level) {
        for (const w of vehicle.weapons) w.critChance = Math.min(0.7, w.critChance + 0.10 * level);
      },
    },
    {
      id: 'shield_passive', label: 'Escudo Passivo', icon: '🔵',
      desc: 'Começa cada partida com escudo de energia',
      unlockPhase: 3, maxLevel: 3, cost: [80, 150, 250],
      apply(vehicle, level) { vehicle.addShield(200 * level); },
    },
    // Fase 4
    {
      id: 'drone_start', label: 'Drone de Combate', icon: '🚁',
      desc: 'Começa com drone de ataque ativo',
      unlockPhase: 4, maxLevel: 1, cost: [150],
      apply(vehicle, _level) { vehicle.activateDrone(); },
    },
    {
      id: 'loot_boost', label: 'Saque Melhorado', icon: '💰',
      desc: '+25% moedas ganhas por kill',
      unlockPhase: 4, maxLevel: 3, cost: [70, 130, 200],
      apply(_vehicle, _level) { /* aplicado via getLootBoostMult() */ },
    },
    { id:'module_fortify', label:'Módulos Reforçados', icon:'🔩', desc:'+35 HP por nível em cada arma', unlockPhase:5,maxLevel:4,cost:[90,150,220,320], apply(vehicle,level){for(const w of vehicle.weapons){w.maxModuleHp+=35*level;w.moduleHp=w.maxModuleHp;}} },
    { id:'drone_power', label:'Núcleo do Drone', icon:'🛸', desc:'Drone ganha cadência com níveis', unlockPhase:6,maxLevel:3,cost:[120,200,300], apply(vehicle,level){vehicle.droneFireMult=1+level*.2;} },
    { id:'overdrive', label:'Overdrive', icon:'⚡', desc:'+6% dano e cadência por nível', unlockPhase:7,maxLevel:3,cost:[150,250,380], apply(vehicle,level){for(const w of vehicle.weapons){w.damage*=1+level*.06;w.fireRate*=Math.pow(.94,level);}} },
    { id:'last_stand', label:'Última Resistência', icon:'🧿', desc:'+150 HP e +100 escudo por nível', unlockPhase:8,maxLevel:2,cost:[250,450], apply(vehicle,level){vehicle.maxHp+=150*level;vehicle.hp=vehicle.maxHp;vehicle.addShield((vehicle.shieldMax||0)+100*level);} },
  ];

  function _load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { coins: 0, perks: {}, maxPhaseReached: 1 };
    } catch { return { coins: 0, perks: {}, maxPhaseReached: 1 }; }
  }

  function _save(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

  function getData()           { return _load(); }
  function getTotalCoins()     { return _load().coins; }
  function getPerkLevel(id)    { return _load().perks[id] || 0; }
  function getMaxPhaseReached(){ return _load().maxPhaseReached || 1; }

  function updateMaxPhase(phase) {
    const d = _load();
    if (phase > (d.maxPhaseReached || 1)) { d.maxPhaseReached = phase; _save(d); }
  }

  function getUnlockedPerks(maxPhase) {
    return PERK_DEFS.filter(p => p.unlockPhase <= maxPhase);
  }

  function addCoins(amount) {
    const d = _load(); d.coins = Math.max(0, (d.coins || 0) + amount); _save(d);
  }

  function canUpgrade(id, maxPhase) {
    const d = _load();
    const def = PERK_DEFS.find(p => p.id === id);
    if (!def) return false;
    if (maxPhase !== undefined && def.unlockPhase > maxPhase) return false;
    const level = d.perks[id] || 0;
    if (level >= def.maxLevel) return false;
    return d.coins >= def.cost[level];
  }

  function buyUpgrade(id) {
    const d = _load();
    const def = PERK_DEFS.find(p => p.id === id);
    if (!def) return false;
    const level = d.perks[id] || 0;
    if (level >= def.maxLevel) return false;
    const cost = def.cost[level];
    if (d.coins < cost) return false;
    d.coins -= cost; d.perks[id] = level + 1; _save(d);
    return true;
  }

  function applyToVehicle(vehicle) {
    const d = _load();
    for (const def of PERK_DEFS) {
      const level = d.perks[def.id] || 0;
      if (level > 0) def.apply(vehicle, level);
    }
  }

  function getLootBoostMult() { return 1 + (getPerkLevel('loot_boost') * 0.25); }

  function resetAll() { try { localStorage.removeItem(STORAGE_KEY); } catch {} }

  return {
    PERK_DEFS, getData, addCoins, getPerkLevel, getMaxPhaseReached,
    updateMaxPhase, getUnlockedPerks, canUpgrade, buyUpgrade,
    applyToVehicle, getLootBoostMult, getTotalCoins, resetAll,
  };
})();

// ── Módulo de arma instanciado ───────────────────────────────
class Weapon {
  constructor(type) {
    const def = WEAPON_DEFS[type];
    this.type = type;
    this.label = def.label;
    this.icon = def.icon;
    this.color = def.color;
    this.barrelColor = def.barrelColor;
    this.fireRate = def.fireRate;
    this.damage = def.damage;
    this.range = def.range;
    this.bulletSpeed = def.bulletSpeed;
    this.bulletSize = def.bulletSize;
    this.bulletColor = def.bulletColor;
    this.weight = def.weight;
    this.aoe = def.aoe;
    this.pellets = def.pellets || 1;
    this.spread = def.spread || 0.08;
    this.upgrades = def.upgrades;
    this.description = def.description;
    this.upgradeLevel = 0;

    this._timer = Math.random() * this.fireRate; // offset para não atirarem juntos
    this.bullets = [];
    this.moduleH = 44; // altura visual do módulo
    this.barrelAngle = 0; // animação de recuo

    // [MELHORIA 1] Vida do módulo — pode ser destruído por inimigos
    this.maxModuleHp = def.moduleHp || 100;
    this.moduleHp = this.maxModuleHp;
    this.destroyed = false; // módulo destruído para de atirar e é removido

    // [MELHORIA 5] Atributos de upgrade avançado
    this.critChance = 0;      // 0–1: chance de dano crítico (2x dano)
    this.doubleFire = false;  // tiro duplo — dispara 2 projéteis ao mesmo tempo
  }

  // ── Tenta atirar, retorna balas novas ──────────────────
  tryFire(dt, worldX, moduleWorldY, target) {
    // [MELHORIA 1] Módulo destruído não atira
    if (this.destroyed) return [];

    this._timer += dt;
    if (this._timer < this.fireRate) return [];
    if (!target) return [];
    this._timer = 0;

    const fromX = worldX + 60;
    const fromY = moduleWorldY;
    const dx = target.x - fromX;
    const dy = target.y - fromY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > this.range) return [];

    const angle = Math.atan2(dy, dx);
    this.barrelAngle = angle;

    // [MELHORIA 5] Verifica crítico — 2x de dano com cor dourada
    const isCrit = Math.random() < this.critChance;
    const finalDamage = isCrit ? this.damage * 2 : this.damage;
    if (isCrit) Effects.floatText(fromX, fromY - 20, 'CRÍTICO!', '#ffaa00', 13);

    const newBullets = [];
    // [MELHORIA 5] Tiro duplo — dispara segundo projétil com leve offset
    const fireCount = this.doubleFire ? 2 : 1;
    for (let shot = 0; shot < fireCount; shot++) {
      const pellets = this.pellets;
      const yOffset = shot === 1 ? 10 : 0; // segundo tiro levemente abaixo
      for (let p = 0; p < pellets; p++) {
        const a = angle + (Math.random() - 0.5) * this.spread * (pellets > 1 ? 1 : 0.3);
        newBullets.push({
          x: fromX, y: fromY + yOffset,
          vx: Math.cos(a) * this.bulletSpeed,
          vy: Math.sin(a) * this.bulletSpeed,
          damage: finalDamage,
          aoe: this.aoe,
          size: isCrit ? this.bulletSize * 1.5 : this.bulletSize,
          color: isCrit ? '#ffaa00' : this.bulletColor,
          type: this.type,
          life: 1.2,
        });
      }
    }
    Effects.muzzleFlash(fromX, fromY, angle);
    return newBullets;
  }

  // [MELHORIA 1] Módulo recebe dano de inimigos — quando chega a 0 é destruído
  takeDamage(dmg) {
    if (this.destroyed) return;
    this.moduleHp -= dmg;
    if (this.moduleHp <= 0) {
      this.moduleHp = 0;
      this.destroyed = true;
      Effects.explosion(0, 0, 0.8); // posição real calculada em Vehicle.draw
      Effects.floatText(0, 0, `${this.label} DESTRUÍDA!`, '#ff4444', 15);
    }
  }

  // [MELHORIA 1] Repara o módulo (usado por upgrades de heal)
  repair(amt) {
    if (!this.destroyed) {
      this.moduleHp = Math.min(this.maxModuleHp, this.moduleHp + amt);
    }
  }

  applyUpgrade(idx) {
    const up = this.upgrades[idx];
    if (!up) return;
    if (up.add !== undefined) this[up.stat] += up.add;
    if (up.mul !== undefined) this[up.stat] *= up.mul;
    this.upgradeLevel++;
  }

  // ── Desenhar módulo ────────────────────────────────────
  draw(ctx, sx, sy, W, isTop) {
    const mh = this.moduleH;
    const mw = 70;

    // [MELHORIA 1] Módulo destruído — desenha escurecido com X
    if (this.destroyed) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#220000';
      roundRect(ctx, sx - mw/2, sy, mw, mh, isTop ? [8,8,0,0] : [0,0,0,0]);
      ctx.fill();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = '#ff2200';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx - mw/2 + 6, sy + 6); ctx.lineTo(sx + mw/2 - 6, sy + mh - 6);
      ctx.moveTo(sx + mw/2 - 6, sy + 6); ctx.lineTo(sx - mw/2 + 6, sy + mh - 6);
      ctx.stroke();
      ctx.restore();
      return;
    }

    // Corpo do módulo
    ctx.save();
    const grad = ctx.createLinearGradient(sx, sy, sx, sy + mh);
    grad.addColorStop(0, lightenColor(this.color, 30));
    grad.addColorStop(1, this.color);
    ctx.fillStyle = grad;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, sx - mw/2, sy, mw, mh, isTop ? [8,8,0,0] : [0,0,0,0]);
    ctx.fill();
    ctx.stroke();

    // Cano da arma (apontando para direita por padrão)
    ctx.save();
    ctx.translate(sx + mw/2 - 8, sy + mh/2);
    ctx.rotate(this.barrelAngle * 0.3); // leve follow do ângulo de tiro
    ctx.fillStyle = this.barrelColor;
    ctx.fillRect(0, -4, 28, 8);
    ctx.fillStyle = '#222';
    ctx.fillRect(24, -3, 6, 6);
    ctx.restore();

    // Ícone
    ctx.font = '18px Rajdhani, Arial';
    ctx.textAlign = 'center';
    ctx.fillText(this.icon, sx, sy + mh/2 + 6);

    // Barra de nível de upgrade
    if (this.upgradeLevel > 0) {
      ctx.fillStyle = '#ffdd00';
      for (let i = 0; i < this.upgradeLevel; i++) {
        ctx.fillRect(sx - mw/2 + 4 + i*8, sy + 3, 5, 3);
      }
    }

    // [MELHORIA 1] Barra de HP do módulo — vermelho quando crítico
    const hpRatio = this.moduleHp / this.maxModuleHp;
    if (hpRatio < 1) {
      const bw = mw - 8, bh = 4;
      const bx = sx - bw/2;
      const by = sy + mh - 6;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = hpRatio > 0.5 ? '#44ff44' : hpRatio > 0.25 ? '#ffaa00' : '#ff3333';
      ctx.fillRect(bx, by, bw * hpRatio, bh);
    }

    // [MELHORIA 5] Ícone de tiro duplo ativo
    if (this.doubleFire) {
      ctx.fillStyle = '#44ffff';
      ctx.font = '8px Rajdhani, Arial';
      ctx.textAlign = 'left';
      ctx.fillText('x2', sx - mw/2 + 3, sy + 10);
    }

    // [MELHORIA 5] Ícone de crítico ativo
    if (this.critChance > 0) {
      ctx.fillStyle = '#ffaa00';
      ctx.font = '8px Rajdhani, Arial';
      ctx.textAlign = 'right';
      ctx.fillText(`⚡${Math.round(this.critChance*100)}%`, sx + mw/2 - 3, sy + 10);
    }

    ctx.restore();
  }
}

// ── Helpers ──────────────────────────────────────────────────
function lightenColor(hex, amt) {
  // Muito simples: aumenta brilho
  try {
    let r = parseInt(hex.slice(1,3),16);
    let g = parseInt(hex.slice(3,5),16);
    let b = parseInt(hex.slice(5,7),16);
    r = Math.min(255, r+amt); g = Math.min(255, g+amt); b = Math.min(255, b+amt);
    return `rgb(${r},${g},${b})`;
  } catch { return hex; }
}

function roundRect(ctx, x, y, w, h, r) {
  if (!Array.isArray(r)) r = [r,r,r,r];
  ctx.beginPath();
  ctx.moveTo(x+r[0], y);
  ctx.lineTo(x+w-r[1], y); ctx.arcTo(x+w, y, x+w, y+r[1], r[1]);
  ctx.lineTo(x+w, y+h-r[2]); ctx.arcTo(x+w, y+h, x+w-r[2], y+h, r[2]);
  ctx.lineTo(x+r[3], y+h); ctx.arcTo(x, y+h, x, y+h-r[3], r[3]);
  ctx.lineTo(x, y+r[0]); ctx.arcTo(x, y, x+r[0], y, r[0]);
  ctx.closePath();
}


/* ===== VEHICLE.JS ===== */
// ============================================================
// vehicle.js — Veículo do jogador com módulos empilháveis
// ============================================================

class Vehicle {
  constructor(canvasH) {
    this.canvasH = canvasH;
    this.groundY = canvasH * 0.72;  // linha do chão

    // Posição do veículo NO MUNDO (x cresce infinitamente)
    this.worldX = 300;
    this.baseSpeed = 80;     // px/s
    this.speed = this.baseSpeed;

    // Vida
    this.maxHp = 500;
    this.hp = this.maxHp;
    this.invincible = 0;     // timer de invencibilidade pós-dano
    this.dead = false;

    // Módulos (armas empilhados)
    this.weapons = [];
    this.addWeapon('minigun'); // começa com metralhadora
    // Progressão permanente aplicada após construção (via Progression.applyToVehicle)

    // Veículo base visual
    this.bodyW = 100;
    this.bodyH = 36;
    this.wheelR = 16;

    // Animação
    this.wheelAngle = 0;
    this.bobY = 0;       // leve balanço vertical
    this.bobTimer = 0;
    this.hitFlash = 0;

    // Escudo
    this.shieldHp = 0;
    this.shieldMax = 0;

    // Drone
    this.droneActive = false;
    this.droneAngle = 0;
    this.droneTimer = 0;
    this.droneBullets = [];
  }

  get totalWeight() {
    return 1 + this.weapons.reduce((s, w) => s + w.weight, 0);
  }

  get stackHeight() {
    return this.weapons.length * 44;
  }

  // Y do topo da torre (espaço de tela, centro X do veículo)
  get screenX() { return 110; } // veículo fixo no canto esquerdo da tela

  get screenY() {
    return this.groundY - this.bodyH - this.stackHeight + this.bobY;
  }

  // Centro do veículo (para colisão, etc.)
  get cx() { return this.worldX; }
  get cy() { return this.groundY - this.bodyH / 2; }

  addWeapon(type) {
    if (this.weapons.length >= 6) return false; // máx 6 módulos
    this.weapons.push(new Weapon(type));
    this._recalcSpeed();
    return true;
  }

  _recalcSpeed() {
    const w = this.totalWeight;
    this.speed = Math.max(25, this.baseSpeed / (1 + w * 0.12));
  }

  takeDamage(dmg) {
    if (this.invincible > 0) return;
    if (this.shieldHp > 0) {
      this.shieldHp -= dmg;
      if (this.shieldHp < 0) {
        dmg = -this.shieldHp;
        this.shieldHp = 0;
      } else {
        Effects.shake(4, 0.15);
        return;
      }
    }
    this.hp = Math.max(0, this.hp - dmg);
    this.hitFlash = 0.25;
    this.invincible = 0.15;
    Effects.flash(0.35);
    Effects.shake(8, 0.25);
    if (this.hp <= 0) this.dead = true;
  }

  heal(amt) { this.hp = Math.min(this.maxHp, this.hp + amt); }

  addShield(amt) { this.shieldMax = amt; this.shieldHp = amt; }

  activateDrone() { this.droneActive = true; }

  // IA de alvo: cada arma escolhe a ameaça que combina com seu papel
  _findTarget(enemies, weapon = null) {
    let best = null, bestScore = -Infinity;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - this.worldX;
      const dy = e.y - this.groundY;
      const d = Math.sqrt(dx*dx + dy*dy);
      const range = weapon ? weapon.range : 700;
      if (d > range * 1.08) continue;
      let threat = 1000 - d;
      if (e.heals) threat += 850;
      if (e.explosive) threat += 650;
      if (e.isBoss) threat += 420;
      if (e.flying) threat += 100;
      if (weapon?.type === 'sniper') threat += (e.heals ? 800 : 0) + (e.explosive ? 450 : 0) + e.maxHp * 0.08;
      if (weapon?.type === 'shotgun') threat += Math.max(0, 360 - d) * 2.2;
      if (weapon?.type === 'rocket') {
        let cluster = 0;
        for (const other of enemies) if (!other.dead && Math.hypot(other.x-e.x, other.y-e.y) < 120) cluster++;
        threat += cluster * 170;
      }
      if (threat > bestScore) { bestScore = threat; best = e; }
    }
    return best;
  }

  update(dt, enemies, allBullets) {
    if (this.dead) return;

    // Avança no mundo
    this.worldX += this.speed * dt;

    // Animação
    this.wheelAngle += (this.speed / this.wheelR) * dt;
    this.bobTimer += dt * 3;
    this.bobY = Math.sin(this.bobTimer) * 1.5;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.invincible > 0) this.invincible -= dt;

    // Cada arma escolhe seu próprio alvo (sniper prioriza especiais, foguete grupos, shotgun proximidade)
    for (let i = 0; i < this.weapons.length; i++) {
      const w = this.weapons[i];
      if (w.destroyed) continue; // [MELHORIA 1] Módulo destruído não atira
      const target = this._findTarget(enemies, w);
      const moduleWorldY = this.groundY - this.bodyH - (i + 0.5) * 44 + this.bobY;
      const newBullets = w.tryFire(dt, this.worldX, moduleWorldY, target);
      for (const b of newBullets) allBullets.push(b);
    }

    // [MELHORIA 1] Remove módulos destruídos da pilha após delay visual de 2s
    // Usamos um timer por módulo para efeito dramático
    for (let i = this.weapons.length - 1; i >= 0; i--) {
      const w = this.weapons[i];
      if (w.destroyed) {
        w._destroyTimer = (w._destroyTimer || 0) + dt;
        if (w._destroyTimer > 2.0) {
          this.weapons.splice(i, 1);
          this._recalcSpeed(); // [MELHORIA 7] Veículo fica mais leve/rápido sem o módulo
        }
      }
    }

    // Drone prioriza curandeiros/explosivos e depois a maior ameaça
    if (this.droneActive) {
      const target = this._findTarget(enemies, { type:'drone', range:650 });
      this.droneAngle += dt * 2.2;
      this.droneTimer += dt;
      if (this.droneTimer > (0.5 / (this.droneFireMult || 1)) && target) {
        this.droneTimer = 0;
        const droneX = this.worldX + Math.cos(this.droneAngle) * 70;
        const droneY = this.groundY - this.bodyH - this.stackHeight - 40;
        allBullets.push({
          x: droneX, y: droneY,
          vx: Math.cos(Math.atan2(target.y - droneY, target.x - droneX)) * 600,
          vy: Math.sin(Math.atan2(target.y - droneY, target.x - droneX)) * 600,
          damage: 18 * (this.weapons.some(w=>w.type==='laser'&&!w.destroyed) ? 1.5 : 1), aoe: 0, size: 4, color: '#44ffff', type: 'laser', life: 1.2,
        });
      }
    }
  }

  // ── Desenhar o veículo (em coordenadas de TELA) ─────────
  draw(ctx, cameraX) {
    if (this.dead) return;
    const sx = this.screenX;
    const groundSY = this.groundY;

    ctx.save();
    if (this.hitFlash > 0 && Math.floor(this.hitFlash * 20) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    // ── Sombra no chão ────────────────────────────────────
    const shadowW = this.bodyW * 0.65 + this.weapons.length * 3;
    const shadowGrad = ctx.createRadialGradient(sx, groundSY + 3, 0, sx, groundSY + 3, shadowW);
    shadowGrad.addColorStop(0, 'rgba(0,0,0,0.45)');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(sx, groundSY + 4, shadowW, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Módulos de arma ───────────────────────────────────
    for (let i = 0; i < this.weapons.length; i++) {
      const w = this.weapons[i];
      const sy = groundSY - this.bodyH - (i + 1) * 44 + this.bobY;
      // Conector metálico entre módulos
      if (i < this.weapons.length - 1) {
        const cx2 = ctx.createLinearGradient(sx - 40, sy + 44, sx + 40, sy + 44);
        cx2.addColorStop(0, 'rgba(0,0,0,0)');
        cx2.addColorStop(0.2, 'rgba(80,100,120,0.7)');
        cx2.addColorStop(0.8, 'rgba(80,100,120,0.7)');
        cx2.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = cx2;
        ctx.fillRect(sx - 40, sy + 44, 80, 4);
        // Parafusos
        ctx.fillStyle = '#8899aa';
        ctx.beginPath(); ctx.arc(sx - 30, sy + 46, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 30, sy + 46, 2, 0, Math.PI*2); ctx.fill();
      }
      w.draw(ctx, sx, sy, this.bodyW, i === this.weapons.length - 1);
    }

    // ── Corpo do veículo ──────────────────────────────────
    const bx = sx - this.bodyW / 2;
    const by = groundSY - this.bodyH + this.bobY;

    // Chassis — gradiente lateral + placa traseira
    const chGrad = ctx.createLinearGradient(bx, by, bx, by + this.bodyH);
    chGrad.addColorStop(0,   '#7a9ab0');
    chGrad.addColorStop(0.3, '#4d6e84');
    chGrad.addColorStop(0.7, '#3a5568');
    chGrad.addColorStop(1,   '#263d4e');
    ctx.fillStyle = chGrad;
    roundRect(ctx, bx, by, this.bodyW, this.bodyH, [5, 5, 2, 2]);
    ctx.fill();

    // Borda metálica superior
    const topGrad = ctx.createLinearGradient(bx, by, bx + this.bodyW, by);
    topGrad.addColorStop(0,   'rgba(255,255,255,0)');
    topGrad.addColorStop(0.15,'rgba(255,255,255,0.25)');
    topGrad.addColorStop(0.85,'rgba(255,255,255,0.25)');
    topGrad.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(bx + 2, by, this.bodyW - 4, 3);

    // Painel lateral esquerdo (detalhe)
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(ctx, bx + 4, by + 6, 12, this.bodyH - 12, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,140,0,0.7)';
    ctx.fillRect(bx + 5, by + this.bodyH - 14, 10, 4); // luz traseira esquerda

    // Painel blindagem frontal (direita)
    const armorGrad = ctx.createLinearGradient(bx + this.bodyW, by, bx + this.bodyW + 14, by);
    armorGrad.addColorStop(0, '#5a7080');
    armorGrad.addColorStop(1, '#2a3a44');
    ctx.fillStyle = armorGrad;
    roundRect(ctx, bx + this.bodyW - 3, by + 3, 14, this.bodyH - 6, [0,3,3,0]);
    ctx.fill();
    // Parafusos na blindagem
    ctx.fillStyle = '#7a9aaa';
    [0.2, 0.5, 0.8].forEach(t => {
      ctx.beginPath();
      ctx.arc(bx + this.bodyW + 5, by + this.bodyH * t, 2, 0, Math.PI*2);
      ctx.fill();
    });

    // Cabine com vidro refletivo
    const cabX = bx + this.bodyW * 0.52;
    const cabW = this.bodyW * 0.32;
    ctx.fillStyle = '#2e4a60';
    roundRect(ctx, cabX, by - 14, cabW, 16, [4,4,0,0]); ctx.fill();
    // Vidro com gradiente reflexo
    const glassGrad = ctx.createLinearGradient(cabX, by - 13, cabX + cabW, by - 13);
    glassGrad.addColorStop(0, 'rgba(80,180,255,0.15)');
    glassGrad.addColorStop(0.3, 'rgba(160,220,255,0.6)');
    glassGrad.addColorStop(0.6, 'rgba(80,180,255,0.3)');
    glassGrad.addColorStop(1, 'rgba(40,120,200,0.2)');
    ctx.fillStyle = glassGrad;
    ctx.fillRect(cabX + 2, by - 12, cabW - 4, 11);
    // Brilho no vidro
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(cabX + 3, by - 11, 4, 3);

    // Luzes dianteiras (frente do veículo = direita)
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffee88';
    ctx.fillStyle = '#ffee88';
    ctx.fillRect(bx + this.bodyW + 8, by + 6, 5, 6);
    ctx.fillStyle = '#ffcc44';
    ctx.fillRect(bx + this.bodyW + 8, by + 14, 5, 4);
    ctx.shadowBlur = 0;
    // Cone de luz projetado
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#ffffaa';
    ctx.beginPath();
    ctx.moveTo(bx + this.bodyW + 13, by + 8);
    ctx.lineTo(bx + this.bodyW + 80, by);
    ctx.lineTo(bx + this.bodyW + 80, by + 22);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // ── Rodas ─────────────────────────────────────────────
    this._drawWheel(ctx, sx - 30, groundSY);
    this._drawWheel(ctx, sx + 30, groundSY);

    // ── Escudo visual ─────────────────────────────────────
    if (this.shieldHp > 0) {
      const ratio = this.shieldHp / this.shieldMax;
      const hue = 200 + ratio * 20;
      ctx.save();
      // Camada hexagonal interna
      ctx.globalAlpha = (0.08 + ratio * 0.12) * (0.7 + Math.sin(Date.now()*0.005)*0.3);
      ctx.strokeStyle = `hsl(${hue},100%,75%)`;
      ctx.lineWidth = 1;
      const sh = this.bodyH + this.stackHeight + 24;
      roundRect(ctx, bx - 12, by - this.stackHeight - 12, this.bodyW + 24, sh, 16);
      ctx.stroke();
      // Borda principal
      ctx.globalAlpha = 0.3 + ratio * 0.35;
      ctx.strokeStyle = `hsl(${hue},100%,70%)`;
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 16; ctx.shadowColor = `hsl(${hue},100%,60%)`;
      roundRect(ctx, bx - 10, by - this.stackHeight - 10, this.bodyW + 20, sh - 4, 14);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // ── Drone ─────────────────────────────────────────────
    if (this.droneActive) {
      const dx = sx + Math.cos(this.droneAngle) * 75;
      const dy = groundSY - this.bodyH - this.stackHeight - 45;
      ctx.save();
      // Corpo do drone
      ctx.shadowBlur = 14; ctx.shadowColor = '#00ffff';
      const droneGrad = ctx.createRadialGradient(dx, dy, 0, dx, dy, 10);
      droneGrad.addColorStop(0, '#88ffff');
      droneGrad.addColorStop(0.5, '#22ccdd');
      droneGrad.addColorStop(1, '#005566');
      ctx.fillStyle = droneGrad;
      ctx.beginPath(); ctx.arc(dx, dy, 9, 0, Math.PI*2); ctx.fill();
      // Anel externo
      ctx.strokeStyle = '#44ffff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(dx, dy, 12, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
      // Hélices (4 braços)
      ctx.strokeStyle = 'rgba(200,255,255,0.7)'; ctx.lineWidth = 2;
      for (let d2 = 0; d2 < 4; d2++) {
        const a = this.droneAngle * 5 + d2 * Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(dx + Math.cos(a)*9, dy + Math.sin(a)*9);
        ctx.lineTo(dx + Math.cos(a)*16, dy + Math.sin(a)*16);
        ctx.stroke();
      }
      // Linha de conexão ao veículo (tracejada)
      ctx.strokeStyle = 'rgba(0,255,255,0.2)'; ctx.lineWidth = 1;
      ctx.setLineDash([4,6]);
      ctx.beginPath(); ctx.moveTo(sx, groundSY - this.bodyH - this.stackHeight); ctx.lineTo(dx, dy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    ctx.restore();
    this._drawHpBar(ctx, sx);
  }

  _drawWheel(ctx, x, groundY) {
    const r = this.wheelR;
    const y = groundY - r + this.bobY;
    ctx.save();

    // Sombra da roda
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, groundY + 2, r * 0.9, 4, 0, 0, Math.PI*2); ctx.fill();

    // Pneu com textura
    const tireGrad = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 1, x, y, r);
    tireGrad.addColorStop(0, '#333');
    tireGrad.addColorStop(0.7, '#1a1a1a');
    tireGrad.addColorStop(1, '#111');
    ctx.fillStyle = tireGrad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();

    // Sulcos do pneu
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = this.wheelAngle + (i / 8) * Math.PI * 2;
      const ix = x + Math.cos(a) * (r - 3), iy = y + Math.sin(a) * (r - 3);
      const ox = x + Math.cos(a) * r, oy = y + Math.sin(a) * r;
      ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ox, oy); ctx.stroke();
    }

    // Aro metálico externo
    ctx.strokeStyle = '#5a6a7a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r - 4, 0, Math.PI*2); ctx.stroke();

    // Aro interno
    ctx.fillStyle = '#2a3a4a';
    ctx.beginPath(); ctx.arc(x, y, r - 7, 0, Math.PI*2); ctx.fill();

    // Raios com gradiente
    ctx.strokeStyle = '#6a8090'; ctx.lineWidth = 2.5;
    for (let i = 0; i < 5; i++) {
      const a = this.wheelAngle + (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * 4, y + Math.sin(a) * 4);
      ctx.lineTo(x + Math.cos(a) * (r - 8), y + Math.sin(a) * (r - 8));
      ctx.stroke();
    }

    // Cubo central
    const hubGrad = ctx.createRadialGradient(x - 1, y - 1, 0, x, y, 5);
    hubGrad.addColorStop(0, '#ccddee');
    hubGrad.addColorStop(1, '#445566');
    ctx.fillStyle = hubGrad;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#7a9aaa'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.stroke();

    ctx.restore();
  }

  _drawHpBar(ctx, sx) {
    const bw = 120, bh = 10;
    const bx = sx - bw/2;
    const by = this.groundY + 20;
    const ratio = this.hp / this.maxHp;
    const hpColor = ratio > 0.5 ? '#44ff44' : ratio > 0.25 ? '#ffaa00' : '#ff3333';

    // Sombra da barra
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(ctx, bx - 1, by - 1, bw + 2, bh + 2, 4);
    ctx.fill();

    // Fundo
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, bx, by, bw, bh, 3);
    ctx.fill();

    // Barra HP com brilho
    if (ratio > 0) {
      ctx.save();
      ctx.shadowBlur = ratio > 0.5 ? 6 : 12;
      ctx.shadowColor = hpColor;
      ctx.fillStyle = hpColor;
      roundRect(ctx, bx + 1, by + 1, (bw - 2) * ratio, bh - 2, 2);
      ctx.fill();
      // Brilho interno
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, bx + 1, by + 1, (bw - 2) * ratio, (bh - 2) * 0.45, 2);
      ctx.fill();
      ctx.restore();
    }

    // Texto HP
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = 'bold 8px Orbitron, Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`${this.hp | 0}/${this.maxHp}`, sx, by + bh - 1);

    // Escudo
    if (this.shieldHp > 0) {
      const sy2 = by - 13;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      roundRect(ctx, bx, sy2, bw, 8, 2);
      ctx.fill();
      ctx.save();
      ctx.shadowBlur = 8; ctx.shadowColor = '#44aaff';
      ctx.fillStyle = '#44aaff';
      roundRect(ctx, bx + 1, sy2 + 1, (bw - 2) * (this.shieldHp / this.shieldMax), 6, 1);
      ctx.fill();
      ctx.restore();
    }
  }
}

// ── Classe Enemy ─────────────────────────────────────────────
class Enemy {
  constructor(type, worldX, vehicleGroundY) {
    const def = ENEMY_DEFS[type];
    this.type = type;
    this.def = def;
    this.label = def.label;
    this.isBoss = def.isBoss || false;

    this.x = worldX;
    // Inimigos voadores ficam mais altos
    this.groundY = vehicleGroundY;
    this.y = def.flying
      ? vehicleGroundY - 80 - Math.random() * 40
      : vehicleGroundY - def.h / 2;

    this.baseY = this.y;

    this.w = def.w; this.h = def.h;
    this.hp = def.hp; this.maxHp = def.hp;
    this.speed = def.speed;
    this.damage = def.damage;
    this.reward = def.reward;
    this.score = def.score;
    this.armor = def.armor;
    this.flying = def.flying;
    this.explosive = def.explosive;
    this.explodeRadius = def.explodeRadius || 0;
    this.color = def.color;
    this.eyeColor = def.eyeColor;
    this.drawFn = def.drawFn;

    this.dead = false;
    this.hitFlash = 0;
    this.animTimer = 0;
    this.animFrame = 0;
    this.floatTimer = Math.random() * Math.PI * 2;

    // Boss: fases
    this.phase = 1;
    this.rageMode = false;

    // [MELHORIA 3] Screamer — offset lateral para ziguezague
    this.zigzag = def.zigzag || false;
    this.zigzagOffset = 0;
    this.zigzagDir = 1;
    this.zigzagTimer = Math.random() * 0.5;

    // [MELHORIA 3] Healer — timer de cura e raio visual
    this.heals = def.heals || false;
    this.healRadius = def.healRadius || 0;
    this.healRate = def.healRate || 0;
    this.healTimer = Math.random() * 2; // offset inicial para não curarem todos juntos
    this.healPulse = 0; // animação do pulso de cura
    this.attackTimer = Math.random() * 0.8;
    this.specialTimer = Math.random() * 1.5;
    this.bossShieldTimer = 0;
    this.bossShieldActive = false;
    this.detonatedOnVehicle = false;
  }

  get cx() { return this.x; }
  get cy() { return this.y; }

  takeDamage(dmg, isExplosive = false, ignoreArmor = false) {
    if (this.dead) return;
    let effective = ignoreArmor ? dmg : (isExplosive ? dmg * (1 - this.armor * 0.5) : dmg * (1 - this.armor));
    if (this.bossShieldActive) effective *= 0.35;
    this.hp -= effective;
    this.hitFlash = 0.12;
    if (this.hp <= 0) this.die();
  }

  die() {
    if (this.dead) return;
    this.dead = true;
    if (this.explosive) {
      Effects.explosion(this.x, this.y, this.isBoss ? 2.5 : 1.4);
    } else {
      Effects.bloodSplat(this.x, this.y);
      Effects.explosion(this.x, this.y, this.isBoss ? 1.8 : 0.7);
    }
    Effects.coinPop(this.x, this.y);
    Effects.floatText(this.x, this.y - 30, `+${this.reward}💰`, '#ffdd00', 16);
    if (this.isBoss) Effects.floatText(this.x, this.y - 55, 'BOSS DERROTADO!', '#ff4444', 22);
  }

  update(dt, vehicleWorldX, allEnemies = null, vehicleRef = null) {
    if (this.dead) return;
    this.animTimer += dt;
    this.animFrame = Math.floor(this.animTimer * 6) % 4;
    if (this.hitFlash > 0) this.hitFlash -= dt;

    // Rage mode para bosses
    if (this.isBoss && this.hp < this.maxHp * 0.4 && !this.rageMode) {
      this.rageMode = true;
      this.speed *= 1.5;
      Effects.floatText(this.x, this.y - 60, '⚠ RAGE MODE!', '#ff0000', 20);
    }

    // Habilidades próprias dos bosses
    this.specialTimer += dt;
    if (this.isBoss && vehicleRef) {
      if (this.type === 'boss_giant' && this.specialTimer > 4.2 && Math.abs(vehicleWorldX-this.x) < 280) {
        this.specialTimer = 0;
        const stomp = Math.max(18, this.damage * 0.45);
        vehicleRef.takeDamage(stomp);
        Effects.shake(18,0.45); Effects.floatText(vehicleRef.worldX, vehicleRef.groundY-120, '💥 TERREMOTO!', '#ff7744', 18);
      }
      if (this.type === 'boss_mutant') {
        if (!this.bossShieldActive && this.specialTimer > 5.0) { this.specialTimer=0; this.bossShieldActive=true; this.bossShieldTimer=2.4; Effects.floatText(this.x,this.y-70,'ESCUDO ATIVO','#44ddff',16); }
        if (this.bossShieldActive) { this.bossShieldTimer-=dt; if(this.bossShieldTimer<=0)this.bossShieldActive=false; }
      }
    }

    // Move em direção ao veículo
    const dx = vehicleWorldX - this.x;
    if (Math.abs(dx) > 4) {
      this.x += Math.sign(dx) * this.speed * dt;
    }

    // [MELHORIA 3] Screamer — movimento em ziguezague lateral
    if (this.zigzag) {
      this.zigzagTimer += dt;
      if (this.zigzagTimer > 0.3 + Math.random() * 0.2) {
        this.zigzagTimer = 0;
        this.zigzagDir *= -1; // inverte direção lateral
      }
      this.y += this.zigzagDir * this.speed * 0.6 * dt;
      // Mantém na faixa do chão
      const minY = this.groundY - this.h * 2;
      const maxY = this.groundY - this.h * 0.3;
      this.y = Math.max(minY, Math.min(maxY, this.y));
      this.baseY = this.y;
    }

    // [MELHORIA 3] Healer — emite pulso de cura em inimigos próximos
    if (this.heals && allEnemies) {
      this.healTimer += dt;
      this.healPulse = Math.max(0, this.healPulse - dt * 2);
      if (this.healTimer > 2.5) { // cura a cada 2.5s
        this.healTimer = 0;
        this.healPulse = 1; // dispara animação de pulso
        let healed = 0;
        for (const other of allEnemies) {
          if (other === this || other.dead) continue;
          const d = Math.sqrt((other.x-this.x)**2 + (other.y-this.y)**2);
          if (d < this.healRadius) {
            other.hp = Math.min(other.maxHp, other.hp + this.healRate);
            healed++;
          }
        }
        if (healed > 0) Effects.floatText(this.x, this.y - 20, `+${this.healRate}HP×${healed}`, '#44ff88', 12);
      }
    }

    // Voadores flutuam e atacam os módulos superiores em mergulhos periódicos
    if (this.flying) {
      this.floatTimer += dt * 2;
      this.y = this.baseY + Math.sin(this.floatTimer) * 18;
      this.attackTimer += dt;
      if (vehicleRef && Math.abs(dx) < 170 && this.attackTimer > 1.25) {
        this.attackTimer = 0;
        const live = vehicleRef.weapons.filter(w => !w.destroyed);
        const targetModule = live.length ? live[live.length - 1] : null;
        if (targetModule) {
          targetModule.moduleHp -= this.damage * 0.8;
          Effects.floatText(vehicleRef.worldX, vehicleRef.groundY - vehicleRef.bodyH - vehicleRef.stackHeight - 12, 'ATAQUE AÉREO!', '#ff66ff', 12);
          if (targetModule.moduleHp <= 0) { targetModule.moduleHp = 0; targetModule.destroyed = true; }
        } else {
          vehicleRef.takeDamage(this.damage * 0.6);
        }
        Effects.shake(4, 0.12);
      }
    }

    // Explosivo: detona ao alcançar o veículo e causa dano radial real
    if (this.explosive && Math.abs(dx) < (this.isBoss ? 85 : 55) && !this.dead) {
      if (vehicleRef) {
        const blastDamage = this.damage * (this.isBoss ? 1.15 : 1.0);
        vehicleRef.takeDamage(blastDamage);
        const live = vehicleRef.weapons.filter(w => !w.destroyed);
        if (live.length) {
          const m = live[Math.max(0, live.length - 1)];
          m.moduleHp -= blastDamage * 0.35;
          if (m.moduleHp <= 0) { m.moduleHp = 0; m.destroyed = true; }
        }
        Effects.floatText(vehicleRef.worldX, vehicleRef.groundY - 90, `-${Math.round(blastDamage)} HP`, '#ff4422', 18);
        Effects.shake(this.isBoss ? 20 : 12, 0.4);
      }
      this.detonatedOnVehicle = true;
      this.die();
    }
  }

  // ── Desenho ───────────────────────────────────────────────
  draw(ctx, cameraX) {
    if (this.dead) return;
    const sx = this.x - cameraX;
    const sy = this.y;

    ctx.save();
    if (this.hitFlash > 0 && Math.floor(this.hitFlash * 20) % 2 === 0) {
      ctx.filter = 'brightness(4)';
    }
    if (this.rageMode) {
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ff0000';
    }

    this[this.drawFn](ctx, sx, sy);
    if (this.bossShieldActive) { ctx.save();ctx.strokeStyle='#44ddff';ctx.lineWidth=3;ctx.shadowBlur=18;ctx.shadowColor='#44ddff';ctx.globalAlpha=.7;ctx.beginPath();ctx.ellipse(sx,sy+this.h*.35,this.w*.7,this.h*.7,0,0,Math.PI*2);ctx.stroke();ctx.restore(); }

    // Blindagem — outline metálico pulsante
    if (this.armor > 0.4) {
      ctx.save();
      const pulse = 0.5 + Math.sin(this.animTimer * 3) * 0.2;
      ctx.strokeStyle = `rgba(150,180,220,${pulse * 0.7})`;
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 6; ctx.shadowColor = '#aabbdd';
      ctx.strokeRect(sx - this.w/2 - 2, sy + this.h*0.1, this.w + 4, this.h*0.9);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Healer — anel de cura pulsante
    if (this.heals && this.healPulse > 0) {
      ctx.save();
      ctx.globalAlpha = this.healPulse * 0.5;
      ctx.strokeStyle = '#44ff88';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 10; ctx.shadowColor = '#44ff88';
      const r = this.healRadius * (1 - this.healPulse * 0.5);
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    ctx.restore();

    this._drawHpBar(ctx, sx, sy);
  }

  // [MELHORIA 3] Desenho do Curandeiro — verde com símbolo de cura
  drawHealer(ctx, sx, sy) {
    const w = this.w, h = this.h;
    // Reutiliza drawHumanoid com toque especial
    this.drawHumanoid(ctx, sx, sy);

    // Cruz de cura no peito
    ctx.save();
    ctx.fillStyle = '#00ffaa';
    ctx.shadowBlur = 8; ctx.shadowColor = '#00ffaa';
    ctx.fillRect(sx - 3, sy + h*0.22, 6, 14); // vertical
    ctx.fillRect(sx - 7, sy + h*0.27, 14, 5);  // horizontal
    ctx.shadowBlur = 0;

    // Aura verde pulsante suave
    ctx.globalAlpha = 0.15 + Math.sin(this.animTimer * 4) * 0.1;
    ctx.fillStyle = '#00ffaa';
    ctx.beginPath();
    ctx.arc(sx, sy + h*0.4, w * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  drawHumanoid(ctx, sx, sy) {
    const w = this.w, h = this.h;
    const x = sx, y = sy;

    // Sombra dinâmica no chão
    const shadowAlpha = 0.18 + Math.abs(Math.sin(this.animTimer * 7)) * 0.08;
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
    ctx.beginPath();
    ctx.ellipse(x, this.groundY, w * 0.48, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const legSway = Math.sin(this.animTimer * 8) * 9;
    const armSway = -legSway * 0.6;

    // ── Pernas ────────────────────────────────────────────
    const legColor = darken(this.color, 35);
    // Calça/perna esquerda
    ctx.fillStyle = legColor;
    roundRect(ctx, x - w*0.25, y + h*0.54, w*0.22, h*0.46 + legSway*0.5, [0,0,3,3]);
    ctx.fill();
    // Calça/perna direita
    roundRect(ctx, x + w*0.03, y + h*0.54, w*0.22, h*0.46 - legSway*0.5, [0,0,3,3]);
    ctx.fill();
    // Bota esquerda
    ctx.fillStyle = darken(this.color, 55);
    ctx.fillRect(x - w*0.28, y + h*0.92 + legSway*0.5, w*0.28, h*0.08);
    // Bota direita
    ctx.fillRect(x, y + h*0.92 - legSway*0.5, w*0.28, h*0.08);

    // ── Corpo ─────────────────────────────────────────────
    const bodyGrad = ctx.createLinearGradient(x - w/2, y + h*0.12, x + w/2, y + h*0.62);
    bodyGrad.addColorStop(0, darken(this.color, 10));
    bodyGrad.addColorStop(0.4, this.color);
    bodyGrad.addColorStop(1, darken(this.color, 25));
    ctx.fillStyle = bodyGrad;
    roundRect(ctx, x - w*0.46, y + h*0.12, w*0.92, h*0.48, [3,3,0,0]);
    ctx.fill();

    // Detalhe de roupa/uniforme
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(x - w*0.05, y + h*0.15, w*0.1, h*0.42); // costura central

    // ── Braços ────────────────────────────────────────────
    const armColor = darken(this.color, 20);
    ctx.fillStyle = armColor;
    // Braço esquerdo
    roundRect(ctx, x - w*0.55, y + h*0.15, w*0.12, h*0.38 + armSway*0.4, [3,3,3,3]);
    ctx.fill();
    // Braço direito
    roundRect(ctx, x + w*0.43, y + h*0.15, w*0.12, h*0.38 - armSway*0.4, [3,3,3,3]);
    ctx.fill();
    // Mãos
    ctx.fillStyle = darken(this.color, 5);
    ctx.beginPath(); ctx.arc(x - w*0.49, y + h*0.54 + armSway*0.4, w*0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w*0.49, y + h*0.54 - armSway*0.4, w*0.1, 0, Math.PI*2); ctx.fill();

    // ── Pescoço ───────────────────────────────────────────
    ctx.fillStyle = darken(this.color, 10);
    ctx.fillRect(x - w*0.1, y + h*0.1, w*0.2, h*0.06);

    // ── Cabeça ────────────────────────────────────────────
    const headGrad = ctx.createLinearGradient(x - w*0.35, y - h*0.02, x + w*0.35, y + h*0.28);
    headGrad.addColorStop(0, this.color);
    headGrad.addColorStop(0.6, darken(this.color, 15));
    headGrad.addColorStop(1, darken(this.color, 30));
    ctx.fillStyle = headGrad;
    roundRect(ctx, x - w*0.36, y - h*0.02, w*0.72, h*0.36, 5);
    ctx.fill();

    // Detalhe superior da cabeça (cabelo/capacete)
    ctx.fillStyle = darken(this.color, 40);
    roundRect(ctx, x - w*0.36, y - h*0.02, w*0.72, h*0.1, [5,5,0,0]);
    ctx.fill();

    // ── Olhos brilhantes ──────────────────────────────────
    ctx.save();
    ctx.shadowBlur = 8; ctx.shadowColor = this.eyeColor;
    ctx.fillStyle = this.eyeColor;
    // Olho esquerdo
    roundRect(ctx, x - w*0.25, y + h*0.06, w*0.16, h*0.1, 2); ctx.fill();
    // Olho direito
    roundRect(ctx, x + w*0.09, y + h*0.06, w*0.16, h*0.1, 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    // Expressão de raiva — sobrancelhas
    ctx.fillStyle = darken(this.color, 50);
    ctx.save();
    ctx.translate(x - w*0.17, y + h*0.04);
    ctx.rotate(-0.3);
    ctx.fillRect(0, 0, w*0.16, h*0.035);
    ctx.restore();
    ctx.save();
    ctx.translate(x + w*0.09, y + h*0.04);
    ctx.rotate(0.3);
    ctx.fillRect(0, 0, w*0.16, h*0.035);
    ctx.restore();

    // Explosivo: barril de TNT no peito
    if (this.explosive) {
      ctx.save();
      ctx.shadowBlur = 6; ctx.shadowColor = '#ff4400';
      ctx.fillStyle = '#cc3300';
      roundRect(ctx, x - 9, y + h*0.22, 18, 16, 3); ctx.fill();
      ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 8px Orbitron, Arial'; ctx.textAlign = 'center';
      ctx.fillText('TNT', x, y + h*0.37);
      // Mecha piscando
      ctx.fillStyle = `rgba(255,${Math.floor(150+Math.sin(Date.now()*0.01)*100)},0,0.9)`;
      ctx.beginPath(); ctx.arc(x - 2, y + h*0.18, 3, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Aura de rage vermelha
    if (this.rageMode) {
      ctx.save();
      ctx.globalAlpha = 0.15 + Math.sin(this.animTimer * 8) * 0.08;
      ctx.fillStyle = '#ff2200';
      ctx.beginPath();
      ctx.arc(x, y + h*0.4, w * 0.8, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  drawFlying(ctx, sx, sy) {
    const w = this.w, h = this.h;
    const wingFlap = Math.sin(this.animTimer * 10) * 0.4;

    // Asas
    ctx.save();
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.85;

    // Asa esquerda
    ctx.save();
    ctx.translate(sx - w*0.1, sy);
    ctx.rotate(wingFlap);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-w*0.9, -h*0.6, -w*0.5, h*0.5, 0, h*0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Asa direita
    ctx.save();
    ctx.translate(sx + w*0.1, sy);
    ctx.rotate(-wingFlap);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(w*0.9, -h*0.6, w*0.5, h*0.5, 0, h*0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Corpo
    ctx.globalAlpha = 1;
    ctx.fillStyle = darken(this.color, 15);
    ctx.beginPath();
    ctx.ellipse(sx, sy + h*0.15, w*0.28, h*0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    // Olhos
    ctx.fillStyle = this.eyeColor;
    ctx.shadowBlur = 6; ctx.shadowColor = this.eyeColor;
    ctx.beginPath();
    ctx.arc(sx - 6, sy + h*0.05, 4, 0, Math.PI * 2);
    ctx.arc(sx + 6, sy + h*0.05, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  drawBossGiant(ctx, sx, sy) {
    const w = this.w, h = this.h;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(sx, this.groundY, w*0.7, 10, 0, 0, Math.PI*2);
    ctx.fill();

    // Corpo enorme
    const g = ctx.createRadialGradient(sx, sy + h*0.4, 10, sx, sy+h*0.4, w);
    g.addColorStop(0, this.color);
    g.addColorStop(1, darken(this.color, 40));
    ctx.fillStyle = g;
    roundRect(ctx, sx - w/2, sy + h*0.18, w, h*0.75, 8);
    ctx.fill();

    // Braços
    ctx.fillStyle = darken(this.color, 15);
    ctx.fillRect(sx - w/2 - 18, sy + h*0.22, 20, h*0.45);
    ctx.fillRect(sx + w/2 - 2, sy + h*0.22, 20, h*0.45);

    // Pernas
    const ls = Math.sin(this.animTimer*5)*12;
    ctx.fillRect(sx - w*0.3, sy + h*0.88, w*0.28, h*0.2 + ls);
    ctx.fillRect(sx + w*0.02, sy + h*0.88, w*0.28, h*0.2 - ls);

    // Cabeça
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(sx, sy + h*0.12, w*0.38, 0, Math.PI*2);
    ctx.fill();

    // Olhos brilhantes grandes
    ctx.fillStyle = this.eyeColor;
    ctx.shadowBlur = 14; ctx.shadowColor = this.eyeColor;
    ctx.beginPath();
    ctx.arc(sx - w*0.14, sy + h*0.09, 7, 0, Math.PI*2);
    ctx.arc(sx + w*0.14, sy + h*0.09, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Rage aura
    if (this.rageMode) {
      ctx.strokeStyle = '#ff2200';
      ctx.lineWidth = 4;
      ctx.globalAlpha = 0.5 + Math.sin(this.animTimer * 8) * 0.3;
      ctx.beginPath();
      ctx.arc(sx, sy + h*0.5, w*0.7, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  drawBossMutant(ctx, sx, sy) {
    const w = this.w, h = this.h;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(sx, this.groundY, w*0.7, 10, 0, 0, Math.PI*2);
    ctx.fill();

    // Corpo blindado com placas
    const bg = ctx.createLinearGradient(sx-w/2, sy, sx+w/2, sy+h);
    bg.addColorStop(0, '#667788');
    bg.addColorStop(0.4, this.color);
    bg.addColorStop(1, '#223344');
    ctx.fillStyle = bg;
    roundRect(ctx, sx-w/2, sy+h*0.1, w, h*0.85, 6);
    ctx.fill();

    // Placas de armadura
    ctx.fillStyle = '#aabbcc';
    ctx.fillRect(sx-w/2, sy+h*0.2, w*0.3, h*0.25);
    ctx.fillRect(sx+w*0.2, sy+h*0.2, w*0.3, h*0.25);
    ctx.fillRect(sx-w*0.15, sy+h*0.5, w*0.3, h*0.2);

    // Cabeça robótica
    ctx.fillStyle = '#445566';
    ctx.fillRect(sx - w*0.33, sy, w*0.66, h*0.25);
    ctx.fillStyle = this.eyeColor;
    ctx.shadowBlur = 10; ctx.shadowColor = this.eyeColor;
    ctx.fillRect(sx - w*0.22, sy + h*0.06, w*0.16, h*0.1);
    ctx.fillRect(sx + w*0.06, sy + h*0.06, w*0.16, h*0.1);
    // Visor
    ctx.fillStyle = 'rgba(0,200,255,0.2)';
    ctx.fillRect(sx - w*0.28, sy + h*0.04, w*0.56, h*0.14);
    ctx.shadowBlur = 0;
  }

  drawBossExploder(ctx, sx, sy) {
    const w = this.w, h = this.h;
    const pulse = 0.9 + Math.sin(this.animTimer * 8) * 0.1;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(sx, this.groundY, w*0.7, 10, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(sx, sy + h*0.5);
    ctx.scale(pulse, pulse);
    ctx.translate(-sx, -(sy + h*0.5));

    // Corpo esférico pulsante
    const eg = ctx.createRadialGradient(sx, sy+h*0.4, 5, sx, sy+h*0.4, w*0.55);
    eg.addColorStop(0, '#ffaa00');
    eg.addColorStop(0.5, this.color);
    eg.addColorStop(1, '#550000');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(sx, sy + h*0.45, w*0.52, 0, Math.PI*2);
    ctx.fill();

    // Cabeça
    ctx.fillStyle = '#cc3300';
    ctx.beginPath();
    ctx.arc(sx, sy + h*0.15, w*0.36, 0, Math.PI*2);
    ctx.fill();

    // Olhos
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffffff';
    ctx.beginPath();
    ctx.arc(sx - w*0.14, sy+h*0.1, 6, 0, Math.PI*2);
    ctx.arc(sx + w*0.14, sy+h*0.1, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Bobinas de energia
    for (let i = 0; i < 5; i++) {
      const a = this.animTimer * 2 + (i / 5) * Math.PI * 2;
      const ex = sx + Math.cos(a) * w*0.52;
      const ey = sy + h*0.45 + Math.sin(a) * h*0.28;
      ctx.fillStyle = `hsl(${(i*72+this.animTimer*90)%360}, 100%, 65%)`;
      ctx.beginPath();
      ctx.arc(ex, ey, 5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  _drawHpBar(ctx, sx, sy) {
    if (this.hp >= this.maxHp) return;
    const bw = this.isBoss ? 160 : this.w + 24;
    const bh = this.isBoss ? 12 : 6;
    const bx = sx - bw/2;
    const by = sy - this.h/2 - (this.isBoss ? 20 : 11);
    const ratio = this.hp / this.maxHp;
    const hpColor = this.isBoss
      ? `hsl(${ratio * 120}, 90%, 50%)`
      : (ratio > 0.5 ? '#44ff44' : ratio > 0.25 ? '#ffaa00' : '#ff3333');

    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(ctx, bx - 1, by - 1, bw + 2, bh + 2, 3);
    ctx.fill();
    // Fundo
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, bx, by, bw, bh, 2);
    ctx.fill();
    // Barra com glow
    if (ratio > 0) {
      ctx.save();
      if (this.isBoss || ratio < 0.25) { ctx.shadowBlur = 8; ctx.shadowColor = hpColor; }
      ctx.fillStyle = hpColor;
      roundRect(ctx, bx + 1, by + 1, (bw - 2) * ratio, bh - 2, 1);
      ctx.fill();
      // Brilho interno
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, bx + 1, by + 1, (bw - 2) * ratio, (bh - 2) * 0.4, 1);
      ctx.fill();
      ctx.restore();
    }

    if (this.isBoss) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 9px Orbitron, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`${this.label}  ${Math.ceil(this.hp)}/${this.maxHp}`, sx, by - 3);
    }
  }
}

// ── Helper ───────────────────────────────────────────────────
function darken(hex, amt) {
  try {
    let r = Math.max(0, parseInt(hex.slice(1,3),16)-amt);
    let g = Math.max(0, parseInt(hex.slice(3,5),16)-amt);
    let b = Math.max(0, parseInt(hex.slice(5,7),16)-amt);
    return `rgb(${r},${g},${b})`;
  } catch { return hex; }
}

// ============================================================

const WAVES = (() => {
  const PHASE_POOLS = {
    1: ['zombie', 'fast_zombie', 'explosive_zombie', 'screamer'],
    2: ['zombie', 'fast_zombie', 'tank_zombie', 'armored', 'screamer', 'healer'],
    3: ['fast_zombie', 'tank_zombie', 'explosive_zombie', 'armored', 'flying', 'healer'],
    4: ['fast_zombie', 'tank_zombie', 'explosive_zombie', 'flying', 'screamer', 'armored', 'healer'],
    5: ['zombie', 'flying', 'healer', 'screamer', 'armored'],
    6: ['fast_zombie', 'tank_zombie', 'flying', 'explosive_zombie', 'healer'],
    7: ['zombie', 'tank_zombie', 'armored', 'flying', 'screamer', 'healer'],
    8: ['fast_zombie', 'tank_zombie', 'explosive_zombie', 'flying', 'screamer', 'armored', 'healer'],
  };
  const PHASE_BOSSES = {
    1: { type: 'boss_giant',    label: '👹 ZUMBI GIGANTE' },
    2: { type: 'boss_mutant',   label: '🤖 MUTANTE BLINDADO' },
    3: { type: 'boss_exploder', label: '💣 MONSTRO EXPLOSIVO' },
    4: { type: 'boss_giant',    label: '💀 LORDE DO ABISMO' },
    5: { type: 'boss_mutant',   label: '🌿 GUARDIÃO DA FLORESTA' },
    6: { type: 'boss_exploder', label: '🐙 LEVIATÃ' },
    7: { type: 'boss_giant',    label: '🧊 TITAN GLACIAL' },
    8: { type: 'boss_giant',    label: '👁 O DEVORADOR' },
  };
  const COSTS = {
    zombie:1, fast_zombie:1.2, tank_zombie:3,
    explosive_zombie:2, flying:1.5, armored:2.5, screamer:1.0, healer:2.0
  };

  function getWaveConfigPhased(phaseNum, waveInPhase, totalWave, isBossWave) {
    const phaseIdx = Math.min(phaseNum, 8);
    const scale = 1 + (totalWave - 1) * 0.18;

    if (isBossWave) {
      const bossData = PHASE_BOSSES[phaseIdx] || PHASE_BOSSES[8];
      // Bosses ficam mais fortes a cada ciclo de fase
      const bossHpMult = 1 + (phaseNum - 1) * 0.5;
      return {
        isBoss: true,
        enemies: [{ type: bossData.type, count: 1, interval: 0, hpMult: bossHpMult }],
        hpScale: scale,
        bossLabel: bossData.label,
        reward: 0,
      };
    }

    const pool = PHASE_POOLS[phaseIdx] || PHASE_POOLS[8];
    // Budget cresce com fase e wave dentro da fase
    const diffMult = typeof getDifficulty === 'function' ? getDifficulty().waveScaleMult : 1;
    const budget = Math.floor((4 + totalWave * 2.2 + phaseNum * 1.5) * diffMult);
    const groups = {};
    let remaining = budget;

    while (remaining >= 1) {
      const affordable = pool.filter(t => COSTS[t] <= remaining);
      if (!affordable.length) break;
      const t = affordable[Math.floor(Math.random() * affordable.length)];
      const c = COSTS[t];
      groups[t] = (groups[t] || 0) + 1;
      remaining -= c;
    }

    const enemies = [];
    for (const [type, count] of Object.entries(groups)) {
      enemies.push({ type, count, interval: Math.max(400, 900 - phaseNum * 60 + Math.random() * 400) });
    }

    return { isBoss: false, enemies, hpScale: scale, reward: 0 };
  }

  // Mantém compatibilidade retroativa
  function getWaveConfig(waveNum) {
    return getWaveConfigPhased(1, waveNum, waveNum, waveNum % 5 === 0);
  }

  return { getWaveConfig, getWaveConfigPhased };
})();

function getRandomUpgrades(vehicle, count = 3) {
  const eligible = UPGRADE_POOL.filter(u => u.condition(vehicle));
  const shuffled = [...eligible].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, Math.min(count, shuffled.length)).map(u => {
    const r=Math.random(); const rarity=r<0.04?'LENDÁRIO':r<0.16?'ÉPICO':r<0.40?'RARO':'COMUM';
    return { ...u, rarity };
  });
}

const GameAudio = (() => {
  let ac=null, master=null, musicOsc=null, musicGain=null;
  function ensure(){
    if (!ac) { ac = new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.18; master.connect(ac.destination); }
    if (ac.state==='suspended') ac.resume().catch(()=>{});
  }
  function beep(freq=440, dur=.06, type='square', vol=.18){
    if (!GamePrefs.data.sound) return; try { ensure(); const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur); o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+dur); } catch{}
  }
  function event(name){ const m={shot:[760,.035,'square',.08],hit:[140,.05,'sawtooth',.08],coin:[1050,.06,'sine',.10],hurt:[90,.12,'sawtooth',.16],boss:[55,.35,'sawtooth',.20],upgrade:[660,.14,'triangle',.12],explode:[65,.22,'sawtooth',.18]}; if(m[name])beep(...m[name]); }
  function toggleMusic(on){ GamePrefs.set('music',on); try{ensure(); if(on && !musicOsc){ musicOsc=ac.createOscillator();musicGain=ac.createGain();musicOsc.type='sine';musicOsc.frequency.value=55;musicGain.gain.value=.018;musicOsc.connect(musicGain);musicGain.connect(master);musicOsc.start(); } else if(!on && musicOsc){musicOsc.stop();musicOsc=null;musicGain=null;} }catch{} }
