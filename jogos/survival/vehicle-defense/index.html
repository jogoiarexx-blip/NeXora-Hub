    phaseNum++;
    waveInPhase = 0;

    // Salva fase máxima atingida
    Progression.updateMaxPhase(phaseNum);

    // Bônus de fase completa salvo automaticamente
    const phaseBonus = 80 + completedPhase * 40;
    Progression.addCoins(Math.floor(coins * 0.6) + phaseBonus);

    // Vai para a loja da fase
    state = STATE.PHASE_SHOP;
    phaseShopNewPerks = Progression.PERK_DEFS.filter(p => p.unlockPhase === phaseNum);
    saveRun('phase-complete');
    maybeNotify(`Fase ${completedPhase} concluída!`, `A oficina está pronta para a próxima missão.`);
  }

  // ── Spawn ─────────────────────────────────────────────────
  function spawnEnemy(type, hpMult = 1) {
    const spawnX = vehicle.worldX + W * 0.55 + Math.random() * 200;
    const e = new Enemy(type, spawnX, vehicle.groundY);
    const diff = getDifficulty();
    e.hp    *= diff.hpMult * hpMult;
    e.maxHp *= diff.hpMult * hpMult;
    e.speed  *= diff.speedMult;
    e.damage *= diff.damageMult;
    e.reward = Math.floor(e.reward * diff.rewardMult);
    enemies.push(e);
  }

  // ── Aplicar upgrade ───────────────────────────────────────
  function applyUpgrade(idx) {
    const up = upgradeChoices[idx]; if(!up)return;
    up.apply(vehicle);
    const rarity=up.rarity||'COMUM';
    if (rarity==='RARO') { for(const w of vehicle.weapons) w.damage*=1.05; vehicle.heal(25); }
    if (rarity==='ÉPICO') { for(const w of vehicle.weapons){w.damage*=1.10;w.fireRate*=0.95;} vehicle.heal(60); }
    if (rarity==='LENDÁRIO') { for(const w of vehicle.weapons){w.damage*=1.15;w.fireRate*=0.90;w.critChance=Math.min(.75,w.critChance+.05);} vehicle.maxHp+=100;vehicle.heal(100); }
    GameAudio.event('upgrade'); GameAudio.vibrate(25);
    state = STATE.PLAYING;
    upgradeChoices = [];
    startNextWave();
    saveRun('upgrade');
  }

  // ── Loop principal ────────────────────────────────────────
  let lastTime = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    switch (state) {
      case STATE.MENU:       drawMenu(); drawEnhancedMenu(); break;
      case STATE.PLAYING:    updateGame(dt); drawGame(); break;
      case STATE.UPGRADE:    drawGame(); drawUpgradeScreen(); break;
      case STATE.GAMEOVER:   drawGame(); drawGameOver(); break;
      case STATE.BOSS_INTRO:
        bossIntroTimer -= dt;
        updateGame(dt);
        drawGame();
        drawBossIntro();
        if (bossIntroTimer <= 0) state = STATE.PLAYING;
        break;
      case STATE.PHASE_INTRO:
        phaseIntroTimer += dt;
        drawGame();
        drawPhaseIntro();
        if (phaseIntroTimer > 4.5) { state = STATE.PLAYING; phaseIntroTimer = 0; startNextWave(); }
        break;
      case STATE.PHASE_SHOP:
        drawPhaseShop();
        break;
      case STATE.PAUSED:
        drawGame(); drawPauseOverlay();
        break;
    }
  }
  requestAnimationFrame(loop);

  // ── Update ────────────────────────────────────────────────
  function updateGame(dt) {
    if (!vehicle || vehicle.dead) {
      if (state !== STATE.GAMEOVER) {
        state = STATE.GAMEOVER;
        if (score > highScore) { highScore = score; localStorage.setItem('tds_hs', highScore); }
        Progression.updateMaxPhase(phaseNum);
        Progression.addCoins(Math.floor(coins * 0.5 + waveNum * 10));
        clearRunSave(); GameAudio.event('hurt'); GameAudio.vibrate([80,40,120]);
        maybeNotify('Vehicle Defense', `Sua missão terminou na fase ${phaseNum}.`);
      }
      return;
    }

    const prevX = vehicle.worldX;
    vehicle.update(dt, enemies, bullets);
    distanceTraveled += vehicle.worldX - prevX;

    // Câmera suave
    const targetCamX = vehicle.worldX - 110;
    cameraX += (targetCamX - cameraX) * Math.min(1, dt * 8);

    // Background offset
    bgOffset = cameraX;

    // Spawn de inimigos
    if (waveActive && spawnQueue.length > 0) {
      spawnTimer += dt;
      while (spawnQueue.length > 0 && spawnTimer >= spawnQueue[0].delay) {
        const entry = spawnQueue.shift();
        spawnEnemy(entry.type, entry.hpMult || 1);
      }
    }

    // Update inimigos
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      // [MELHORIA 3] Passa array de inimigos para o update (Healer precisa)
      e.update(dt, vehicle.worldX, enemies, vehicle);
      if (e.dead) {
        coins += Math.floor(e.reward * Progression.getLootBoostMult());
        score += e.score;

        // [MELHORIA 6] Loot drop — 35% chance de moeda extra, 10% de caixa de reparo
        const roll = Math.random();
        if (roll < 0.10) {
          loots.push({ x: e.x, y: e.y, type: 'repair', value: 60, icon: '🔧', life: 8, bobTimer: 0 });
          Effects.lootDrop(e.x, e.y, 'repair');
        } else if (roll < 0.35) {
          const bonus = e.reward * 2 + Math.floor(Math.random() * 15);
          loots.push({ x: e.x, y: e.y, type: 'coin', value: bonus, icon: '💰', life: 8, bobTimer: 0 });
          Effects.lootDrop(e.x, e.y, 'coin');
        }

        enemies.splice(i, 1);
        continue;
      }
      // Dano de contato
      if (!e.flying && !e.explosive) {
        const dx = e.x - vehicle.worldX;
        if (Math.abs(dx) < vehicle.bodyW * 0.5 + e.w * 0.5 - 8) {
          vehicle.takeDamage(e.damage * dt * 0.8);

          // [MELHORIA 1] Inimigo em contato também danifica o módulo mais baixo
          if (vehicle.weapons.length > 0) {
            const lowestModule = vehicle.weapons[0]; // índice 0 = mais baixo na pilha
            if (!lowestModule.destroyed) {
              lowestModule.moduleHp -= e.damage * dt * 0.4;
              if (lowestModule.moduleHp <= 0) {
                lowestModule.moduleHp = 0;
                if (!lowestModule.destroyed) {
                  lowestModule.destroyed = true;
                  // Efeito de destruição com posição real do módulo
                  const modScreenX = vehicle.worldX - cameraX;
                  const modWorldY = vehicle.groundY - vehicle.bodyH - 22;
                  Effects.explosion(vehicle.worldX, modWorldY, 0.8);
                  Effects.floatText(vehicle.worldX, modWorldY - 20, `${lowestModule.label} DESTRUÍDA!`, '#ff4444', 15);
                  Effects.shake(10, 0.3);
                }
              }
            }
          }
        }
      }
    }

    // [MELHORIA 6] Atualiza e coleta loots
    for (let i = loots.length - 1; i >= 0; i--) {
      const l = loots[i];
      l.life -= dt;
      l.bobTimer += dt * 3;
      // Remove loot expirado
      if (l.life <= 0) { loots.splice(i, 1); continue; }
      // Coleta automática quando veículo passa perto
      const dist = Math.abs(l.x - vehicle.worldX);
      if (dist < 80) {
        if (l.type === 'coin') {
          coins += l.value;
          Effects.floatText(l.x, l.y - 20, `+${l.value}💰`, '#ffdd00', 14);
          Effects.coinPop(l.x, l.y);
        } else if (l.type === 'repair') {
          vehicle.heal(l.value);
          Effects.floatText(l.x, l.y - 20, `+${l.value}HP`, '#44ff88', 14);
        }
        loots.splice(i, 1);
      }
    }

    // Update balas
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      if (b.life <= 0 || b.x > vehicle.worldX + W) {
        bullets.splice(i, 1);
        continue;
      }

      // Colisão com inimigos
      let hit = false;
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = b.x - e.x;
        const dy = b.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const hitR = (e.w + e.h) * 0.28;

        if (dist < hitR) {
          if (b.aoe > 0) {
            // Explosão em área
            for (const other of enemies) {
              if (other.dead) continue;
              const od = Math.sqrt((b.x-other.x)**2 + (b.y-other.y)**2);
              if (od < b.aoe) {
                other.takeDamage(b.damage * (1 - od / b.aoe * 0.5), true);
              }
            }
            Effects.explosion(b.x, b.y, 1.2);
          } else {
            // Laser ignora armadura de verdade, conforme a descrição da arma
            e.takeDamage(b.damage, false, b.type === 'laser');
            Effects.bulletHit(b.x, b.y);
          }
          hit = true;
          break;
        }
      }
      if (hit) { bullets.splice(i, 1); continue; }
    }

    // Verifica conclusão da wave
    if (waveActive && spawnQueue.length === 0 && enemies.length === 0 && !waveComplete) {
      waveComplete = true;
      waveActive = false;
      betweenWaveTimer = 0;
      const bonus = 20 + waveNum * 5;
      coins += bonus;
      const isBossWave = waveConfig && waveConfig.isBoss;
      Effects.floatText(W/2 + cameraX, vehicle.groundY - 100,
        isBossWave ? `BOSS DERROTADO! +${bonus}💰` : `WAVE ${waveInPhase}/${WAVES_PER_PHASE} COMPLETA! +${bonus}💰`,
        isBossWave ? '#ff8844' : '#44ff88', 20);
      GameAudio.event(isBossWave ? 'explode' : 'coin'); saveRun('wave-complete');
    }

    if (waveComplete) {
      betweenWaveTimer += dt;
      const delay = waveConfig && waveConfig.isBoss ? 2.5 : 2.0;
      if (betweenWaveTimer > delay) {
        waveComplete = false;
        const isBossJustDefeated = waveConfig && waveConfig.isBoss;
        if (isBossJustDefeated) {
          // Boss derrotado = fim de fase
          advancePhase();
        } else {
          upgradeChoices = getRandomUpgrades(vehicle, 3);
          state = STATE.UPGRADE;
        }
      }
    }

    if (Date.now() - lastAutosaveAt > 12000) saveRun('timer');
    Effects.update(dt);
  }

  // ── Desenho do mundo ─────────────────────────────────────
  function drawGame() {
    ctx.clearRect(0, 0, W, H);

    const shk = Effects.getShakeOffset();
    ctx.save();
    ctx.translate(shk.x, shk.y);

    drawBackground();
    drawGround();

    // Ordenar inimigos por Y para pseudo-profundidade
    const sortedEnemies = [...enemies].sort((a,b) => a.y - b.y);
    for (const e of sortedEnemies) e.draw(ctx, cameraX);

    // Balas com trilha e glow aprimorados por tipo
    for (const b of bullets) {
      ctx.save();
      const bsx = b.x - cameraX;
      const trailSpd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);

      if (trailSpd > 0) {
        const trailLen = b.type === 'laser' ? 32 : b.type === 'sniper' ? 26 : b.type === 'rocket' ? 16 : 12;
        const normX = -b.vx / trailSpd, normY = -b.vy / trailSpd;
        const tx = normX * trailLen, ty = normY * trailLen;

        if (b.type === 'laser') {
          // Laser: duplo rastro fino e brilhante
          const lg = ctx.createLinearGradient(bsx, b.y, bsx + tx, b.y + ty);
          lg.addColorStop(0, b.color);
          lg.addColorStop(0.4, b.color + 'aa');
          lg.addColorStop(1, 'transparent');
          // Fio central
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = b.size * 0.5;
          ctx.shadowBlur = b.size * 5; ctx.shadowColor = b.color;
          ctx.beginPath(); ctx.moveTo(bsx, b.y); ctx.lineTo(bsx + tx, b.y + ty); ctx.stroke();
          // Glow externo
          ctx.strokeStyle = lg;
          ctx.lineWidth = b.size * 2;
          ctx.shadowBlur = b.size * 8;
          ctx.beginPath(); ctx.moveTo(bsx, b.y); ctx.lineTo(bsx + tx, b.y + ty); ctx.stroke();
        } else if (b.type === 'sniper') {
          // Sniper: rastro longo e fino
          const sg = ctx.createLinearGradient(bsx, b.y, bsx + tx, b.y + ty);
          sg.addColorStop(0, b.color);
          sg.addColorStop(1, 'transparent');
          ctx.strokeStyle = sg;
          ctx.lineWidth = b.size * 0.7;
          ctx.shadowBlur = b.size * 4; ctx.shadowColor = b.color;
          ctx.beginPath(); ctx.moveTo(bsx, b.y); ctx.lineTo(bsx + tx, b.y + ty); ctx.stroke();
        } else if (b.type === 'rocket') {
          // Foguete: rastro de fumaça/fogo
          for (let t2 = 0; t2 < 4; t2++) {
            const tf = t2 / 3;
            ctx.fillStyle = tf < 0.4 ? `rgba(255,200,50,${0.6-tf*0.5})` : `rgba(80,80,80,${0.3-tf*0.2})`;
            ctx.beginPath();
            ctx.arc(bsx + normX * trailLen * tf, b.y + normY * trailLen * tf,
                    b.size * (1.5 - tf), 0, Math.PI*2);
            ctx.fill();
          }
        } else {
          // Padrão: rastro simples
          const dg = ctx.createLinearGradient(bsx, b.y, bsx + tx, b.y + ty);
          dg.addColorStop(0, b.color + 'cc');
          dg.addColorStop(1, 'transparent');
          ctx.strokeStyle = dg;
          ctx.lineWidth = b.size * 0.7;
          ctx.shadowBlur = b.size * 2.5; ctx.shadowColor = b.color;
          ctx.beginPath(); ctx.moveTo(bsx, b.y); ctx.lineTo(bsx + tx, b.y + ty); ctx.stroke();
        }
      }

      // Núcleo da bala
      if (b.type === 'rocket') {
        // Foguete: forma elipse apontada
        ctx.save();
        ctx.translate(bsx, b.y);
        if (trailSpd > 0) ctx.rotate(Math.atan2(b.vy, b.vx));
        const rg = ctx.createLinearGradient(-b.size*2, 0, b.size*2, 0);
        rg.addColorStop(0, '#ffcc44'); rg.addColorStop(0.5, '#ff6600'); rg.addColorStop(1, '#cc2200');
        ctx.fillStyle = rg;
        ctx.shadowBlur = 10; ctx.shadowColor = '#ff8800';
        ctx.beginPath();
        ctx.ellipse(0, 0, b.size * 2.2, b.size * 0.85, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = b.size * 3; ctx.shadowColor = b.color;
        ctx.beginPath(); ctx.arc(bsx, b.y, b.size, 0, Math.PI*2); ctx.fill();
        // Núcleo branco
        if (b.size > 3) {
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.shadowBlur = 0;
          ctx.beginPath(); ctx.arc(bsx, b.y, b.size * 0.38, 0, Math.PI*2); ctx.fill();
        }
      }

      ctx.restore();
    }

    vehicle && vehicle.draw(ctx, cameraX);

    // [MELHORIA 6] Desenha loots no mundo com efeito de flutuação
    for (const l of loots) {
      const lx = l.x - cameraX;
      const ly = l.y + Math.sin(l.bobTimer) * 6 - 10; // flutua para cima/baixo
      const alpha = Math.min(1, l.life * 0.5); // fade out nos últimos 2s
      ctx.save();
      ctx.globalAlpha = alpha;
      // Brilho por tipo
      ctx.shadowBlur = 12;
      ctx.shadowColor = l.type === 'coin' ? '#ffdd00' : '#44ff88';
      ctx.font = '20px Rajdhani, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(l.icon, lx, ly);
      // Círculo de coleta (raio visual)
      ctx.globalAlpha = alpha * 0.2;
      ctx.strokeStyle = l.type === 'coin' ? '#ffdd00' : '#44ff88';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(lx, ly, 28, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    Effects.draw(ctx, cameraX, W, H);

    drawHUD();

    ctx.restore();
  }

  // ── Background parallax aprimorado ───────────────────────
  let bgLightningTimer = 0;
  let bgLightningAlpha = 0;
  let bgLightningX = 0;

  function drawBackground() {
    const phase = getCurrentPhase();

    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.72);
    skyGrad.addColorStop(0, phase.skyTop);
    skyGrad.addColorStop(0.4, phase.skyMid);
    skyGrad.addColorStop(1, phase.skyBot);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H * 0.75);

    if (phase.ambientColor) {
      ctx.save(); ctx.fillStyle = phase.ambientColor; ctx.fillRect(0, 0, W, H * 0.75); ctx.restore();
    }

    if (phase.bgMod === 'desert') {
      ctx.save();
      const sandFog = ctx.createLinearGradient(0, H * 0.55, 0, H * 0.72);
      sandFog.addColorStop(0, 'rgba(180,80,0,0)');
      sandFog.addColorStop(1, 'rgba(180,80,0,0.18)');
      ctx.fillStyle = sandFog; ctx.fillRect(0, H * 0.55, W, H * 0.17);
      ctx.restore();
    } else if (phase.bgMod === 'base') {
      ctx.save();
      ctx.strokeStyle = 'rgba(0,100,255,0.04)'; ctx.lineWidth = 1;
      for (let yy = 0; yy < H * 0.72; yy += 8) {
        ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
      }
      ctx.restore();
    } else if (phase.bgMod === 'hell') {
      ctx.save();
      const lavaGlow = ctx.createLinearGradient(0, H * 0.5, 0, H * 0.72);
      lavaGlow.addColorStop(0, 'rgba(200,0,0,0)');
      lavaGlow.addColorStop(1, 'rgba(255,30,0,0.25)');
      ctx.fillStyle = lavaGlow; ctx.fillRect(0, H * 0.5, W, H * 0.22);
      ctx.fillStyle = 'rgba(255,80,0,0.5)';
      for (let em = 0; em < 15; em++) {
        const ex = ((em * 211 + bgOffset * 0.3) % W + W) % W;
        const ey = H * (0.4 + Math.sin(em * 1.3 + bgOffset * 0.001) * 0.12);
        ctx.beginPath(); ctx.arc(ex, ey, 1 + (em%3)*0.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    } else if (phase.bgMod === 'forest') {
      // Névoa verde rasteira
      ctx.save();
      const mistG = ctx.createLinearGradient(0, H*0.5, 0, H*0.72);
      mistG.addColorStop(0, 'rgba(0,60,0,0)');
      mistG.addColorStop(1, 'rgba(0,120,10,0.22)');
      ctx.fillStyle = mistG; ctx.fillRect(0, H*0.5, W, H*0.22);
      // Vagalumes
      ctx.fillStyle = 'rgba(100,255,80,0.7)';
      for (let ff = 0; ff < 12; ff++) {
        const fx = ((ff * 173 + bgOffset * 0.2) % W + W) % W;
        const fy = H * (0.3 + Math.sin(ff * 2.1 + bgOffset * 0.0015) * 0.2);
        const fa = 0.3 + Math.sin(ff + bgOffset * 0.004) * 0.3;
        ctx.globalAlpha = Math.max(0, fa);
        ctx.shadowBlur = 8; ctx.shadowColor = '#44ff44';
        ctx.beginPath(); ctx.arc(fx, fy, 2, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      ctx.restore();
    } else if (phase.bgMod === 'ocean') {
      // Ondas de luz no fundo
      ctx.save();
      for (let w2 = 0; w2 < 3; w2++) {
        const waveY = H * (0.45 + w2 * 0.08) + Math.sin(bgOffset * 0.002 + w2) * 5;
        ctx.strokeStyle = `rgba(0,180,255,${0.08 - w2*0.02})`;
        ctx.lineWidth = 2 + w2;
        ctx.beginPath(); ctx.moveTo(0, waveY);
        for (let wx = 0; wx <= W; wx += 20) {
          ctx.lineTo(wx, waveY + Math.sin(wx * 0.04 + bgOffset * 0.003 + w2) * 6);
        }
        ctx.stroke();
      }
      // Spray de água
      ctx.fillStyle = 'rgba(150,220,255,0.4)';
      for (let sp = 0; sp < 8; sp++) {
        const sx2 = ((sp * 197 + bgOffset * 0.15) % W + W) % W;
        const sy2 = H * (0.5 + Math.sin(sp * 1.7) * 0.05);
        ctx.beginPath(); ctx.arc(sx2, sy2, 1.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    } else if (phase.bgMod === 'tundra') {
      // Neve caindo
      ctx.save();
      ctx.fillStyle = 'rgba(220,235,255,0.6)';
      for (let sn = 0; sn < 25; sn++) {
        const snx = ((sn * 127 + bgOffset * 0.1) % W + W) % W;
        const sny = ((sn * 89 + bgOffset * 0.25) % (H * 0.72));
        ctx.globalAlpha = 0.3 + (sn%3) * 0.2;
        ctx.beginPath(); ctx.arc(snx, sny, 1 + (sn%3)*0.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // Aurora boreal
      ctx.save();
      const aurora = ctx.createLinearGradient(0, 0, 0, H*0.35);
      aurora.addColorStop(0, 'rgba(0,200,150,0)');
      aurora.addColorStop(0.5, `rgba(0,200,150,${0.06 + Math.sin(bgOffset*0.001)*0.03})`);
      aurora.addColorStop(1, 'rgba(0,200,150,0)');
      ctx.fillStyle = aurora; ctx.fillRect(0, 0, W, H*0.35);
      ctx.restore();
    } else if (phase.bgMod === 'chaos') {
      // Raios roxos caóticos
      ctx.save();
      const chaosTime = bgOffset * 0.002;
      for (let cr = 0; cr < 4; cr++) {
        const cx2 = W * (0.2 + cr * 0.2 + Math.sin(chaosTime + cr) * 0.1);
        ctx.strokeStyle = `rgba(200,0,255,${0.12 + Math.sin(chaosTime * 2 + cr) * 0.06})`;
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 8; ctx.shadowColor = '#cc00ff';
        ctx.beginPath(); ctx.moveTo(cx2, 0);
        ctx.lineTo(cx2 + 10, H*0.15); ctx.lineTo(cx2 - 8, H*0.3);
        ctx.lineTo(cx2 + 12, H*0.5); ctx.stroke();
      }
      // Partículas de caos flutuando
      ctx.fillStyle = 'rgba(200,0,255,0.5)';
      for (let cp = 0; cp < 20; cp++) {
        const cpx = ((cp * 163 + bgOffset * 0.18) % W + W) % W;
        const cpy = H * (0.1 + Math.sin(cp * 1.9 + chaosTime) * 0.35);
        ctx.globalAlpha = 0.2 + Math.sin(cp + chaosTime * 3) * 0.15;
        ctx.shadowBlur = 6; ctx.shadowColor = '#ff00ff';
        ctx.beginPath(); ctx.arc(cpx, cpy, 1.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      ctx.restore();
    }

    const lightningColor = phase.id === 3 ? '#44aaff' : phase.id === 4 ? '#ff4444' :
                           phase.id === 5 ? '#44ff44' : phase.id === 6 ? '#00ccff' :
                           phase.id === 7 ? '#aaccff' : phase.id === 8 ? '#cc00ff' : '#ccbbff';
    if (bgLightningAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = bgLightningAlpha * 0.18;
      ctx.fillStyle = lightningColor;
      ctx.fillRect(0, 0, W, H * 0.72);
      ctx.globalAlpha = bgLightningAlpha;
      ctx.strokeStyle = lightningColor;

  // ── Transição de Fase ─────────────────────────────────────
  function drawPhaseIntro() {
    const phase = getCurrentPhase();
    const t = phaseIntroTimer; // 0 → 4.5s

    // Fade in nos primeiros 0.6s, fade out nos últimos 0.8s
    const fadeIn  = Math.min(1, t / 0.6);
    const fadeOut = t > 3.7 ? Math.max(0, 1 - (t - 3.7) / 0.8) : 1;
    const alpha   = fadeIn * fadeOut;

    ctx.save();

    // Overlay escuro com cor da fase
    ctx.globalAlpha = alpha * 0.88;
    const fog = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
    fog.addColorStop(0, 'rgba(0,0,0,0.6)');
    fog.addColorStop(1, 'rgba(0,0,0,0.95)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, 0, W, H);

    // Linha horizontal animada que cruza a tela
    const lineProgress = Math.min(1, t / 0.9);
    ctx.globalAlpha = alpha * 0.6;
    ctx.strokeStyle = phase.groundLine;
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 8; ctx.shadowColor = phase.groundLine;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.42);
    ctx.lineTo(W * lineProgress, H * 0.42);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W, H * 0.62);
    ctx.lineTo(W - W * lineProgress, H * 0.62);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';

    // Número da fase — aparece aos 0.3s
    if (t > 0.3) {
      const phaseAlpha = Math.min(1, (t - 0.3) / 0.4);
      ctx.save();
      ctx.globalAlpha = alpha * phaseAlpha;
      ctx.fillStyle = phase.groundLine;
      ctx.font = `${Math.floor(W * 0.028)}px Rajdhani, Rajdhani, Arial`;
      ctx.letterSpacing = '4px';
      ctx.fillText(`— FASE ${phaseNum} —`, W/2, H * 0.35);
      ctx.restore();
    }

    // Nome da fase — aparece aos 0.6s com efeito de entrada
    if (t > 0.6) {
      const nameAlpha = Math.min(1, (t - 0.6) / 0.5);
      const nameY = H * 0.48 - Math.max(0, (1 - nameAlpha) * 20);
      ctx.save();
      ctx.globalAlpha = alpha * nameAlpha;
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 30; ctx.shadowColor = phase.moonGlow;
      ctx.font = `bold ${Math.floor(W * 0.075)}px Orbitron, Orbitron, Arial`;
      ctx.fillText(phase.icon + ' ' + phase.name, W/2, nameY);

    // Subtítulo — aparece aos 1.0s

      ctx.fillStyle = '#888899';
      ctx.font = `${Math.floor(W * 0.028)}px Rajdhani, Rajdhani, Arial`;
      ctx.fillText(`${WAVES_PER_PHASE} waves + 1 boss`, W/2, H * 0.67);
      ctx.restore();
    }

    // Indicador de progresso de fase (bolinhas) — aparece aos 2.0s
    if (t > 2.0 && PHASE_DEFS.length > 1) {
      const dotAlpha = Math.min(1, (t - 2.0) / 0.4);
      ctx.save();
      ctx.globalAlpha = alpha * dotAlpha;
      const dotSpacing = 28;
      const totalDots = PHASE_DEFS.length;
      const dotsStartX = W/2 - (totalDots - 1) * dotSpacing / 2;
      for (let d = 0; d < totalDots; d++) {
        const dx = dotsStartX + d * dotSpacing;
        const active = d < phaseNum;
        const current = d === phaseNum - 1;
        ctx.beginPath();
        ctx.arc(dx, H * 0.77, current ? 7 : 5, 0, Math.PI*2);
        if (current) {
          ctx.fillStyle = phase.groundLine;
          ctx.shadowBlur = 12; ctx.shadowColor = phase.moonGlow;
        } else if (active) {
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.shadowBlur = 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
        // Label abaixo do dot
        ctx.fillStyle = current ? '#ffffff' : 'rgba(255,255,255,0.35)';
        ctx.font = `${Math.floor(W * 0.022)}px Rajdhani, Rajdhani, Arial`;
        ctx.fillText(PHASE_DEFS[d].icon, dx, H * 0.77 + 18);
      }
      ctx.restore();
    }

    // Prompt de toque — aparece aos 2.5s
    if (t > 2.5) {
      const tapAlpha = Math.min(1, (t - 2.5) / 0.4) * (0.5 + Math.sin(t * 4) * 0.4);
      ctx.save();
      ctx.globalAlpha = alpha * tapAlpha;
      ctx.fillStyle = 'rgba(200,200,200,0.8)';
      ctx.font = `${Math.floor(W * 0.028)}px Rajdhani, Rajdhani, Arial`;
      ctx.fillText('▶ Toque para continuar', W/2, H * 0.88);
      ctx.restore();
    }

    ctx.restore();
  }

  // ── Loja de Fase ─────────────────────────────────────────
  let phaseShopScrollOff = 0; // reserved for future scroll

  function drawPhaseShop() {
    const isFromMenu = (vehicle == null || vehicle.dead);
    const completedPhase = isFromMenu ? Math.max(1, phaseNum - 1) : phaseNum - 1;
    const displayCompleted = Math.max(1, completedPhase);
    const maxPhase = Progression.getMaxPhaseReached();
    const phaseDef = PHASE_DEFS[Math.min(displayCompleted - 1, PHASE_DEFS.length - 1)];
    const nextPhaseDef = PHASE_DEFS[Math.min(phaseNum - 1, PHASE_DEFS.length - 1)];
    const permCoins = Progression.getTotalCoins();
    const allUnlocked = Progression.getUnlockedPerks(maxPhase);

    ctx.clearRect(0, 0, W, H);

    // ── Fundo temático da fase completada ────────────────
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, phaseDef.skyTop);
    bg.addColorStop(0.6, phaseDef.skyMid);
    bg.addColorStop(1, phaseDef.skyBot);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    // Vinheta
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.1, W/2, H/2, H*0.9);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

    // ── Cabeçalho ────────────────────────────────────────
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, 64);
    ctx.fillStyle = phaseDef.groundLine;
    ctx.fillRect(0, 63, W, 2);

    ctx.textAlign = 'left';
    ctx.fillStyle = phaseDef.groundLine;
    ctx.font = `bold ${Math.floor(W * 0.032)}px Orbitron, Orbitron, Arial`;
    ctx.fillText(isFromMenu ? `${phaseDef.icon}  LOJA DE UPGRADES` : `${phaseDef.icon}  FASE ${displayCompleted} COMPLETA!`, 14, 24);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = `${Math.floor(W * 0.024)}px Rajdhani, Rajdhani, Arial`;
    ctx.fillText(isFromMenu ? `Fase máxima: ${maxPhase}` : `Próxima: ${nextPhaseDef.icon} ${nextPhaseDef.name}`, 14, 46);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.floor(W * 0.038)}px Orbitron, Orbitron, Arial`;
    ctx.shadowBlur = 8; ctx.shadowColor = '#ffaa00';
    ctx.fillText(`🪙 ${permCoins}`, W - 14, 28);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${Math.floor(W * 0.022)}px Rajdhani, Rajdhani, Arial`;
    ctx.fillText('moedas permanentes', W - 14, 48);

    // ── Seção: Novos desbloqueios ─────────────────────────
    let curY = 80;

    if (phaseShopNewPerks.length > 0) {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffdd44';
      ctx.font = `bold ${Math.floor(W * 0.028)}px Orbitron, Orbitron, Arial`;
      ctx.shadowBlur = 6; ctx.shadowColor = '#ffaa00';
      ctx.fillText('✨ NOVOS UPGRADES DESBLOQUEADOS!', 14, curY + 18);
      ctx.shadowBlur = 0;
      curY += 30;

      const newCardW = Math.min(160, (W - 28) / phaseShopNewPerks.length - 8);
      const newCardH = 72;
      const newTotalW = phaseShopNewPerks.length * (newCardW + 8) - 8;
      let ncx = W/2 - newTotalW/2;
      for (const def of phaseShopNewPerks) {
        ctx.save();
        // Brilho pulsante de novo item
        ctx.shadowBlur = 16; ctx.shadowColor = '#ffdd44';
        ctx.strokeStyle = 'rgba(255,220,50,0.6)';
        ctx.lineWidth = 2;
        const ng = ctx.createLinearGradient(ncx, curY, ncx, curY + newCardH);
        ng.addColorStop(0, 'rgba(60,50,0,0.9)');
        ng.addColorStop(1, 'rgba(30,25,0,0.9)');
        ctx.fillStyle = ng;
        roundRect(ctx, ncx, curY, newCardW, newCardH, 8);
        ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.textAlign = 'center';
        ctx.font = `${Math.floor(newCardW * 0.22)}px Rajdhani, Rajdhani, Arial`;
        ctx.fillText(def.icon, ncx + newCardW/2, curY + newCardH * 0.48);
        ctx.fillStyle = '#ffdd88';
        ctx.font = `bold ${Math.floor(newCardW * 0.1)}px Orbitron, Orbitron, Arial`;
        ctx.fillText(def.label, ncx + newCardW/2, curY + newCardH * 0.72);
        ctx.fillStyle = 'rgba(255,220,100,0.6)';
        ctx.font = `${Math.floor(newCardW * 0.085)}px Rajdhani, Rajdhani, Arial`;
        ctx.fillText(`🔓 Fase ${def.unlockPhase}`, ncx + newCardW/2, curY + newCardH * 0.9);
        ctx.restore();
        ncx += newCardW + 8;
      }
      curY += newCardH + 14;
    }

    // ── Linha separadora ─────────────────────────────────
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(14, curY); ctx.lineTo(W - 14, curY); ctx.stroke();
    curY += 10;

    // ── Grade de upgrades disponíveis ────────────────────
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `${Math.floor(W * 0.026)}px Rajdhani, Rajdhani, Arial`;
    ctx.fillText('TODOS OS UPGRADES  (escolha quantos quiser)', 14, curY + 14);
    curY += 22;

    const cols = Math.min(4, allUnlocked.length);
    const cardGap = 8;
    const cardW = Math.floor((W - 28 - cardGap * (cols - 1)) / cols);
    const cardH = Math.min(120, (H - curY - 90) / Math.ceil(allUnlocked.length / cols));

    allUnlocked.forEach((def, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const cx = 14 + col * (cardW + cardGap);
      const cy = curY + row * (cardH + cardGap);

      const level = Progression.getPerkLevel(def.id);
      const maxed = level >= def.maxLevel;
      const cost = maxed ? 0 : def.cost[level];
      const affordable = !maxed && permCoins >= cost;
      const isNew = phaseShopNewPerks.some(p => p.id === def.id);

      ctx.save();
      // Fundo
      if (maxed) {
        ctx.fillStyle = 'rgba(20,60,20,0.85)';
      } else if (affordable) {
        ctx.fillStyle = 'rgba(15,30,60,0.9)';
      } else {
        ctx.fillStyle = 'rgba(20,20,30,0.8)';
      }
      if (isNew) { ctx.shadowBlur = 10; ctx.shadowColor = '#ffdd44'; }
      roundRect(ctx, cx, cy, cardW, cardH, 8);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Borda
      ctx.strokeStyle = maxed ? 'rgba(80,200,80,0.5)' :
                        isNew  ? 'rgba(255,210,50,0.6)' :
                        affordable ? 'rgba(80,120,220,0.5)' : 'rgba(60,60,80,0.4)';
      ctx.lineWidth = isNew ? 2 : 1.5;
      roundRect(ctx, cx, cy, cardW, cardH, 8);
      ctx.stroke();
      ctx.restore();

      // Ícone
      ctx.font = `${Math.floor(cardH * 0.3)}px Rajdhani, Rajdhani, Arial`;
      ctx.textAlign = 'left';
      ctx.fillText(def.icon, cx + 8, cy + cardH * 0.42);

      // Label
      ctx.fillStyle = maxed ? '#88ff88' : affordable ? '#ffffff' : '#778899';
      ctx.font = `bold ${Math.floor(cardW * 0.09)}px Orbitron, Orbitron, Arial`;
      ctx.fillText(def.label, cx + cardH * 0.38, cy + cardH * 0.3);

      // Desc
      ctx.fillStyle = 'rgba(180,190,210,0.65)';
      ctx.font = `${Math.floor(cardW * 0.073)}px Rajdhani, Rajdhani, Arial`;
      ctx.fillText(def.desc, cx + cardH * 0.38, cy + cardH * 0.5);

      // Fase de desbloqueio
      ctx.fillStyle = isNew ? '#ffdd44' : 'rgba(150,160,180,0.5)';
      ctx.font = `${Math.floor(cardW * 0.067)}px Rajdhani, Rajdhani, Arial`;
      ctx.fillText(`🔓 Fase ${def.unlockPhase}`, cx + cardH * 0.38, cy + cardH * 0.68);

      // Custo / nivel / max
      ctx.textAlign = 'right';
      if (maxed) {
        ctx.fillStyle = '#44ff88';
        ctx.font = `bold ${Math.floor(cardW * 0.082)}px Orbitron, Orbitron, Arial`;
        ctx.fillText('MAX ✓', cx + cardW - 8, cy + cardH * 0.35);
      } else {
        ctx.fillStyle = affordable ? '#ffdd44' : '#664422';
        ctx.font = `bold ${Math.floor(cardW * 0.092)}px Orbitron, Orbitron, Arial`;
        ctx.shadowBlur = affordable ? 6 : 0; ctx.shadowColor = '#ffcc00';
        ctx.fillText(`🪙 ${cost}`, cx + cardW - 8, cy + cardH * 0.35);
        ctx.shadowBlur = 0;
      }

      // Barrinhas de nível
      const barW2 = Math.min(70, cardW * 0.38);
      const barSpc = barW2 / def.maxLevel;
      for (let b = 0; b < def.maxLevel; b++) {
        const bx2 = cx + cardW - 8 - barW2 + b * barSpc;
        ctx.fillStyle = b < level ? (maxed ? '#44ff88' : '#4488ff') : 'rgba(255,255,255,0.12)';
        roundRect(ctx, bx2 + 1, cy + cardH * 0.55, barSpc - 3, 5, 2);
        ctx.fill();
      }
    });

    // ── Botão CONTINUAR / VOLTAR ──────────────────────────
    const btnW = Math.min(280, W * 0.6), btnH = 48;
    const btnX = W/2 - btnW/2, btnY = H - 66;
    const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
    btnGrad.addColorStop(0, phaseDef.moonColor + 'cc');
    btnGrad.addColorStop(1, phaseDef.moonColor + '66');
    ctx.fillStyle = btnGrad;
    ctx.shadowBlur = 16; ctx.shadowColor = phaseDef.moonGlow;
    roundRect(ctx, btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = phaseDef.groundLine;
    ctx.lineWidth = 1.5;
    roundRect(ctx, btnX, btnY, btnW, btnH, 10);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.floor(btnW * 0.11)}px Orbitron, Orbitron, Arial`;
    const btnLabel = isFromMenu
      ? '◀  VOLTAR AO MENU'
      : `▶  INICIAR FASE ${phaseNum}  ${nextPhaseDef.icon}`;
    ctx.fillText(btnLabel, W/2, btnY + btnH * 0.65);
  }

  function handlePhaseShopClick(x, y) {
    const maxPhase = Progression.getMaxPhaseReached();
    const allUnlocked = Progression.getUnlockedPerks(maxPhase);

    // Botão continuar / voltar
    const btnW = Math.min(280, W * 0.6), btnH = 48;
    const btnX = W/2 - btnW/2, btnY = H - 66;
    if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
      const isFromMenu = (vehicle == null || vehicle.dead);
      if (isFromMenu) {
        state = STATE.MENU;
      } else {
        continuePhase();
      }
      return;
    }

    // Calcular layout dos cards
    let curY = 80;
    if (phaseShopNewPerks.length > 0) { curY += 30 + 72 + 14; }
    curY += 32;

    const cols = Math.min(4, allUnlocked.length);
    const cardGap = 8;
    const cardW = Math.floor((W - 28 - cardGap * (cols - 1)) / cols);
    const cardH = Math.min(120, (H - curY - 90) / Math.ceil(allUnlocked.length / cols));

    allUnlocked.forEach((def, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const cx = 14 + col * (cardW + cardGap);
      const cy = curY + row * (cardH + cardGap);
      if (x >= cx && x <= cx + cardW && y >= cy && y <= cy + cardH) {
        if (Progression.canUpgrade(def.id, maxPhase)) {
          Progression.buyUpgrade(def.id);
        }
      }
    });
  }

  // ── Menu ────────────────────────────────────────────────────
  // ── Menu helpers ─────────────────────────────────────────
  function _menuBtnLayout() {
    const TAB_LABELS = ['🗺 FASES', '🔧 LOJA', '⚡ DIFICULDADE'];
    const tabW = Math.floor((W - 28) / 3);
    const tabH = 42;
    const tabY = H * 0.46;
    const tabs = TAB_LABELS.map((l, i) => ({
      label: l, x: 14 + i * tabW, y: tabY, w: tabW - 6, h: tabH,
    }));
    const playBw = Math.min(260, W * 0.6), playBh = 52;
    const playBtn = { x: W/2 - playBw/2, y: H - 70, w: playBw, h: playBh };
    return { tabs, playBtn };
  }

  function handleMenuClick(x, y) {
    const { tabs, playBtn } = _menuBtnLayout();
    // Tabs
    for (let i = 0; i < tabs.length; i++) {
      const t = tabs[i];
      if (x >= t.x && x <= t.x + t.w && y >= t.y && y <= t.y + t.h) {
        menuTab = i; return;
      }
    }
    // Play button
    if (x >= playBtn.x && x <= playBtn.x + playBtn.w && y >= playBtn.y && y <= playBtn.y + playBtn.h) {
      startGame(selectedPhase); return;
    }
    // Tab content clicks
    if (menuTab === 1) _menuShopClick(x, y);
    if (menuTab === 2) _menuDiffClick(x, y);
    if (menuTab === 0) _menuPhaseClick(x, y);
  }

  function _menuPhaseClick(x, y) {
    const maxPhase = Progression.getMaxPhaseReached();
    const { tabs } = _menuBtnLayout();
    const contentY = tabs[0].y + tabs[0].h + 8;
    const phaseCardH = Math.min(72, (H - contentY - 90) / PHASE_DEFS.length - 6);
    PHASE_DEFS.forEach((pd, i) => {
      const cy = contentY + i * (phaseCardH + 6);
      if (i + 1 <= maxPhase && x >= 14 && x <= W - 14 && y >= cy && y <= cy + phaseCardH) {
        selectedPhase = i + 1;
      }
    });
  }

  function _menuShopClick(x, y) {
    const maxPhase = Progression.getMaxPhaseReached();
    const allUnlocked = Progression.getUnlockedPerks(maxPhase);
    const contentY = H * 0.46 + 48;
    const contentH = H - contentY - 80;
    const cols = Math.min(2, allUnlocked.length);
    const cardGap = 8;
    const cardW = Math.floor((W - 28 - cardGap * (cols - 1)) / cols);
    const cardH = Math.min(90, (contentH - cardGap * Math.ceil(allUnlocked.length/cols)) / Math.ceil(allUnlocked.length/cols));
    allUnlocked.forEach((def, idx) => {
      const col = idx % cols, row = Math.floor(idx / cols);
      const cx = 14 + col * (cardW + cardGap);
      const cy = contentY + row * (cardH + cardGap);
      if (x >= cx && x <= cx + cardW && y >= cy && y <= cy + cardH) {
        Progression.buyUpgrade(def.id);
      }
    });
  }

  function _menuDiffClick(x, y) {
    const contentY = H * 0.46 + 52;
    const cardH = 66, cardGap = 10;
    DIFFICULTY_DEFS.forEach((d, i) => {
      const cy = contentY + i * (cardH + cardGap);
      if (x >= 14 && x <= W - 14 && y >= cy && y <= cy + cardH) {
        selectedDifficulty = i;
        try { localStorage.setItem('vd_diff', i); } catch {}
      }
    });
  }

  function drawMenu() {
    // Garante que selectedPhase não aponte para fase bloqueada
    const _maxP = Progression.getMaxPhaseReached();
    if (selectedPhase > _maxP) selectedPhase = _maxP;
    if (selectedPhase < 1) selectedPhase = 1;
    ctx.clearRect(0, 0, W, H);

    // Fundo
    const diff = getDifficulty();
    const bgG = ctx.createLinearGradient(0, 0, 0, H);
    bgG.addColorStop(0, '#05000f');
    bgG.addColorStop(0.5, '#120618');
    bgG.addColorStop(1, '#1a0a05');
    ctx.fillStyle = bgG; ctx.fillRect(0, 0, W, H);

    // Partículas decorativas
    for (let i = 0; i < 30; i++) {
      const px = (i * 137 + 50) % W, py = (i * 97 + 30) % (H * 0.38);
      ctx.globalAlpha = 0.12 + (i%4)*0.06;
      ctx.fillStyle = i%2===0 ? '#ff4400' : '#8844ff';
      ctx.beginPath(); ctx.arc(px, py, (i%3)*0.4+0.3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Título
    ctx.textAlign = 'center';
    ctx.shadowBlur = 40; ctx.shadowColor = '#ff3300';
    ctx.fillStyle = '#ff5500';
    ctx.font = `bold ${Math.floor(W * 0.085)}px Orbitron, Orbitron, Arial`;
    ctx.fillText('VEHICLE', W/2, H * 0.14);
    ctx.shadowBlur = 15; ctx.shadowColor = '#ff8844';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('DEFENSE', W/2, H * 0.23);
    ctx.shadowBlur = 0;

    // Moedas + dificuldade ativa
    const permCoins = Progression.getTotalCoins();
    ctx.font = `bold ${Math.floor(W * 0.033)}px Orbitron, Orbitron, Arial`;
    ctx.fillStyle = '#ffdd44';
    ctx.shadowBlur = 5; ctx.shadowColor = '#ffaa00';
    ctx.fillText(`🪙 ${permCoins}`, W/2 - 50, H * 0.31);
    ctx.shadowBlur = 0;
    ctx.fillStyle = diff.color;
    ctx.font = `bold ${Math.floor(W * 0.031)}px Orbitron, Orbitron, Arial`;
    ctx.fillText(`${diff.icon} ${diff.label}`, W/2 + 50, H * 0.31);

    // Perks ativos
    const activePerks = Progression.getUnlockedPerks(Progression.getMaxPhaseReached()).filter(p => Progression.getPerkLevel(p.id) > 0);
    if (activePerks.length > 0) {
      ctx.fillStyle = 'rgba(100,150,255,0.08)';
      roundRect(ctx, W/2 - 140, H * 0.335, 280, 24, 6); ctx.fill();
      ctx.fillStyle = '#6688cc';
      ctx.font = `${Math.floor(W * 0.026)}px Rajdhani, Rajdhani, Arial`;
      ctx.fillText(activePerks.slice(0,6).map(p => `${p.icon}${Progression.getPerkLevel(p.id)}`).join(' '), W/2, H * 0.352);
    }

    // ── TABS ──────────────────────────────────────────────
    const { tabs, playBtn } = _menuBtnLayout();
    const TAB_COLORS = ['#3366cc', '#226622', '#885511'];
    tabs.forEach((t, i) => {
      const active = menuTab === i;
      ctx.fillStyle = active ? TAB_COLORS[i] : 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = active ? 10 : 0;
      ctx.shadowColor = TAB_COLORS[i];
      roundRect(ctx, t.x, t.y, t.w, t.h, 8); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = active ? TAB_COLORS[i] + 'cc' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, t.x, t.y, t.w, t.h, 8); ctx.stroke();
      ctx.fillStyle = active ? '#ffffff' : '#aaaacc';
      ctx.font = `${active ? 'bold ' : ''}${Math.floor(W * 0.03)}px Orbitron, Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(t.label, t.x + t.w/2, t.y + t.h * 0.67);
    });

    const contentY = tabs[0].y + tabs[0].h + 8;

    // ── TAB 0: FASES ──────────────────────────────────────
    if (menuTab === 0) {
      const maxPhase = Progression.getMaxPhaseReached();
      const phaseCardH = Math.min(72, (H - contentY - 90) / PHASE_DEFS.length - 6);

      // Dica no topo
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(180,190,220,0.5)';
      ctx.font = `${Math.floor(W * 0.024)}px Rajdhani, Rajdhani, Arial`;
      ctx.fillText('Toque em uma fase desbloqueada para selecioná-la', W/2, contentY - 2);

      PHASE_DEFS.forEach((pd, i) => {
        const cy = contentY + 8 + i * (phaseCardH + 6);
        const unlocked = i + 1 <= maxPhase;
        const selected = selectedPhase === i + 1;

        ctx.save();
        // Fundo
        if (selected && unlocked) {
          ctx.fillStyle = `rgba(${parseInt(pd.moonColor.slice(1,3)||'44',16)},${parseInt(pd.moonColor.slice(3,5)||'44',16)},${parseInt(pd.moonColor.slice(5,7)||'44',16)},0.25)`;
        } else {
          ctx.fillStyle = unlocked ? 'rgba(10,12,20,0.75)' : 'rgba(5,5,10,0.88)';
        }
        roundRect(ctx, 14, cy, W - 28, phaseCardH, 8); ctx.fill();

        // Borda
        if (selected && unlocked) {
          ctx.strokeStyle = pd.groundLine;
          ctx.lineWidth = 2.5;
          ctx.shadowBlur = 10; ctx.shadowColor = pd.moonGlow;
        } else {
          ctx.strokeStyle = unlocked ? pd.groundLine + '55' : 'rgba(60,60,80,0.3)';
          ctx.lineWidth = 1;
          ctx.shadowBlur = 0;
        }
        roundRect(ctx, 14, cy, W - 28, phaseCardH, 8); ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.globalAlpha = unlocked ? 1 : 0.3;

        // Ícone
        ctx.font = `${Math.floor(phaseCardH * 0.48)}px Rajdhani, Rajdhani, Arial`;
        ctx.textAlign = 'left';
        ctx.fillText(pd.icon, 22, cy + phaseCardH * 0.66);

        // Nome + subtítulo
        ctx.font = `bold ${Math.floor(W * 0.034)}px Orbitron, Orbitron, Arial`;
        ctx.fillStyle = unlocked ? (selected ? '#ffffff' : '#ccddee') : '#444455';
        ctx.fillText(`FASE ${i+1}  —  ${pd.name}`, 22 + phaseCardH * 0.58, cy + phaseCardH * 0.42);
        ctx.font = `${Math.floor(W * 0.025)}px Rajdhani, Rajdhani, Arial`;
        ctx.fillStyle = unlocked ? 'rgba(180,200,230,0.65)' : '#2a2a38';
        ctx.fillText(pd.subtitle, 22 + phaseCardH * 0.58, cy + phaseCardH * 0.71);

        // Badge direita
        ctx.textAlign = 'right';
        ctx.font = `bold ${Math.floor(W * 0.025)}px Orbitron, Orbitron, Arial`;
        if (!unlocked) {
          ctx.fillStyle = '#333344';
          ctx.fillText('🔒 BLOQUEADA', W - 18, cy + phaseCardH * 0.57);
        } else if (selected) {
          ctx.fillStyle = pd.groundLine;
          ctx.shadowBlur = 6; ctx.shadowColor = pd.moonGlow;
          ctx.fillText('▶ SELECIONADA', W - 18, cy + phaseCardH * 0.57);
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = 'rgba(150,170,200,0.5)';
          ctx.fillText('✓ DISPONÍVEL', W - 18, cy + phaseCardH * 0.57);
        }

        ctx.globalAlpha = 1;
        ctx.restore();
      });
    }

    // ── TAB 1: LOJA ───────────────────────────────────────
    if (menuTab === 1) {
      const maxPhase = Progression.getMaxPhaseReached();
      const allUnlocked = Progression.getUnlockedPerks(maxPhase);
      const lockedPerks = Progression.PERK_DEFS.filter(p => p.unlockPhase > maxPhase);
      const permCoins2 = Progression.getTotalCoins();
      const cols = Math.min(2, allUnlocked.length);
      const cardGap = 8;
      const cardW = Math.floor((W - 28 - cardGap * (cols - 1)) / cols);
      const cardH = Math.min(90, (H - contentY - 90) / (Math.ceil(allUnlocked.length / cols) + (lockedPerks.length > 0 ? 0.5 : 0)));

      allUnlocked.forEach((def, idx) => {
        const col = idx % cols, row = Math.floor(idx / cols);
        const cx = 14 + col * (cardW + cardGap);
        const cy = contentY + row * (cardH + cardGap);
        const level = Progression.getPerkLevel(def.id);
        const maxed = level >= def.maxLevel;
        const cost = maxed ? 0 : def.cost[level];
        const affordable = !maxed && permCoins2 >= cost;

        ctx.save();
        ctx.fillStyle = maxed ? 'rgba(20,60,20,0.85)' : affordable ? 'rgba(15,30,60,0.9)' : 'rgba(20,20,35,0.8)';
        roundRect(ctx, cx, cy, cardW, cardH, 8); ctx.fill();
        ctx.strokeStyle = maxed ? 'rgba(80,200,80,0.5)' : affordable ? 'rgba(80,120,220,0.5)' : 'rgba(60,60,80,0.3)';
        ctx.lineWidth = 1.5;
        roundRect(ctx, cx, cy, cardW, cardH, 8); ctx.stroke();

        // Ícone
        ctx.font = `${Math.floor(cardH * 0.38)}px Rajdhani, Rajdhani, Arial`;
        ctx.textAlign = 'left';
        ctx.fillText(def.icon, cx + 8, cy + cardH * 0.54);

        // Texts
        const tx = cx + cardH * 0.5;
        ctx.fillStyle = maxed ? '#88ff88' : affordable ? '#ffffff' : '#778899';
        ctx.font = `bold ${Math.floor(W * 0.028)}px Orbitron, Orbitron, Arial`;
        ctx.fillText(def.label, tx, cy + cardH * 0.33);
        ctx.fillStyle = 'rgba(160,180,210,0.6)';
        ctx.font = `${Math.floor(W * 0.022)}px Rajdhani, Rajdhani, Arial`;
        ctx.fillText(def.desc, tx, cy + cardH * 0.55);
        // Fase badge
        ctx.fillStyle = 'rgba(150,160,200,0.45)';
        ctx.font = `${Math.floor(W * 0.02)}px Rajdhani, Rajdhani, Arial`;
        ctx.fillText(`🔓 Fase ${def.unlockPhase}`, tx, cy + cardH * 0.76);

        // Custo/level (direita)
        ctx.textAlign = 'right';
        if (maxed) {
          ctx.fillStyle = '#44ff88'; ctx.font = `bold ${Math.floor(W * 0.026)}px Orbitron, Orbitron, Arial`;
          ctx.fillText('MAX ✓', cx + cardW - 8, cy + cardH * 0.38);
        } else {
          ctx.fillStyle = affordable ? '#ffdd44' : '#553322';
          ctx.shadowBlur = affordable ? 5 : 0; ctx.shadowColor = '#ffcc00';
          ctx.font = `bold ${Math.floor(W * 0.03)}px Orbitron, Orbitron, Arial`;
          ctx.fillText(`🪙${cost}`, cx + cardW - 8, cy + cardH * 0.38);
          ctx.shadowBlur = 0;
        }
        // Barrinhas nível
        const bw2 = Math.min(60, cardW * 0.35);
        const bspc = bw2 / def.maxLevel;
        for (let b = 0; b < def.maxLevel; b++) {
          const bx2 = cx + cardW - 8 - bw2 + b * bspc;
          ctx.fillStyle = b < level ? (maxed ? '#44ff88' : '#4488ff') : 'rgba(255,255,255,0.12)';
          roundRect(ctx, bx2 + 1, cy + cardH * 0.58, bspc - 3, 5, 2); ctx.fill();
        }
        ctx.restore();
      });

      // Perks bloqueados (resumo)
      if (lockedPerks.length > 0) {
        const lockedY = contentY + Math.ceil(allUnlocked.length / cols) * (cardH + cardGap) + 6;
        ctx.fillStyle = 'rgba(60,60,80,0.4)';
        roundRect(ctx, 14, lockedY, W - 28, 32, 6); ctx.fill();
        ctx.fillStyle = '#445566';
        ctx.font = `${Math.floor(W * 0.025)}px Rajdhani, Rajdhani, Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(`🔒 ${lockedPerks.map(p=>`${p.icon} Fase ${p.unlockPhase}`).join('  ')}`, W/2, lockedY + 21);
      }
    }

    // ── TAB 2: DIFICULDADE ────────────────────────────────
    if (menuTab === 2) {
      const cardH2 = Math.min(66, (H - contentY - 90) / DIFFICULTY_DEFS.length - 10);
      DIFFICULTY_DEFS.forEach((d, i) => {
        const cy = contentY + i * (cardH2 + 10);
        const active = selectedDifficulty === i;
        ctx.save();
        if (active) {
          ctx.shadowBlur = 14; ctx.shadowColor = d.glow;
          ctx.fillStyle = d.color + '33';
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
        }
        roundRect(ctx, 14, cy, W - 28, cardH2, 8); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = active ? d.color + 'cc' : 'rgba(80,80,100,0.3)';
        ctx.lineWidth = active ? 2.5 : 1;
        roundRect(ctx, 14, cy, W - 28, cardH2, 8); ctx.stroke();

        // Ícone
        ctx.font = `${Math.floor(cardH2 * 0.5)}px Rajdhani, Rajdhani, Arial`;
        ctx.textAlign = 'left';
        ctx.fillText(d.icon, 22, cy + cardH2 * 0.64);

        // Label
        ctx.fillStyle = active ? d.color : '#aaaacc';
        ctx.font = `bold ${Math.floor(W * 0.038)}px Orbitron, Orbitron, Arial`;
        ctx.fillText(d.label, 22 + cardH2 * 0.6, cy + cardH2 * 0.44);
        ctx.fillStyle = active ? 'rgba(255,255,255,0.7)' : '#556677';
        ctx.font = `${Math.floor(W * 0.026)}px Rajdhani, Rajdhani, Arial`;
        ctx.fillText(d.desc, 22 + cardH2 * 0.6, cy + cardH2 * 0.72);

        // Stats (direita)
        ctx.textAlign = 'right';
        ctx.fillStyle = active ? 'rgba(255,255,255,0.5)' : 'rgba(100,100,130,0.5)';
        ctx.font = `${Math.floor(W * 0.021)}px Rajdhani, Rajdhani, Arial`;
        ctx.fillText(`HP inimigo ${Math.round(d.hpMult*100)}%  |  Velocidade ${Math.round(d.speedMult*100)}%  |  Recompensa ${Math.round(d.rewardMult*100)}%`, W - 18, cy + cardH2 * 0.57);

        if (active) {
          ctx.fillStyle = d.color;
          ctx.font = `bold ${Math.floor(W * 0.024)}px Orbitron, Orbitron, Arial`;
          ctx.fillText('◀ SELECIONADA', W - 18, cy + cardH2 * 0.82);
        }
        ctx.restore();
      });
    }

    // ── Botão JOGAR ───────────────────────────────────────
    const playG = ctx.createLinearGradient(playBtn.x, playBtn.y, playBtn.x, playBtn.y + playBtn.h);
    playG.addColorStop(0, '#ff5500'); playG.addColorStop(1, '#cc2200');
    ctx.fillStyle = playG;
    ctx.shadowBlur = 20; ctx.shadowColor = '#ff3300';
    roundRect(ctx, playBtn.x, playBtn.y, playBtn.w, playBtn.h, 10); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.floor(W * 0.042)}px Orbitron, Orbitron, Arial`;
    const selPd = PHASE_DEFS[selectedPhase - 1];
    const diffLabel = `${getDifficulty().icon} JOGAR — ${selPd.icon} FASE ${selectedPhase}`;
    ctx.fillText(diffLabel, W/2, playBtn.y + playBtn.h * 0.65);

    // High score
    ctx.fillStyle = '#ffdd00';
    ctx.font = `${Math.floor(W * 0.027)}px Rajdhani, Rajdhani, Arial`;
    ctx.fillText(`🏆 ${highScore} pts`, W/2, H - 12);
  }

  // ── Game Over + Loja de Progressão ───────────────────────
  let shopScrollY = 0;
  let shopHoverIdx = -1;

  function drawGameOver() {
    // Fundo escuro com névoa vermelha
    ctx.save();
    const fog = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
    fog.addColorStop(0, 'rgba(80,0,0,0.55)');
    fog.addColorStop(1, 'rgba(0,0,0,0.82)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    const permCoins = Progression.getTotalCoins();
    const defs = Progression.getUnlockedPerks(Progression.getMaxPhaseReached());

    // ── Painel esquerdo: resultado ────────────────────────
    const panelW = Math.min(W * 0.44, 320);
    const panelX = W * 0.03;
    const panelY = H * 0.06;
    const panelH = H * 0.88;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(ctx, panelX, panelY, panelW, panelH, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,60,30,0.4)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, panelX, panelY, panelW, panelH, 14);
    ctx.stroke();
    ctx.restore();

    // Game Over título
    ctx.save();
    ctx.textAlign = 'center';
    ctx.shadowBlur = 24; ctx.shadowColor = '#ff0000';
    ctx.fillStyle = '#ff2222';
    ctx.font = `bold ${Math.floor(panelW * 0.18)}px Orbitron, Orbitron, Arial`;
    ctx.fillText('GAME', panelX + panelW/2, panelY + panelH * 0.12);
    ctx.fillText('OVER', panelX + panelW/2, panelY + panelH * 0.22);
    ctx.shadowBlur = 0;
    ctx.restore();

    // Linha divisória
    ctx.save();
    ctx.strokeStyle = 'rgba(255,60,30,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(panelX + 20, panelY + panelH * 0.27);
    ctx.lineTo(panelX + panelW - 20, panelY + panelH * 0.27);
    ctx.stroke();
    ctx.restore();

    // Stats da partida
    const stats = [
      { label: 'Fase', value: `${phaseNum} ${getCurrentPhase().icon}`, color: getCurrentPhase().groundLine },
      { label: 'Wave', value: `${waveInPhase}/${WAVES_PER_PHASE}`, color: '#ff6644' },
      { label: 'Score', value: `${score} pts`, color: '#ffffff' },
      { label: 'Distância', value: `${Math.floor(distanceTraveled)}m`, color: '#aaaaaa' },
      { label: 'Moedas ganhas', value: `+${Math.floor(coins * 0.5 + waveNum * 10)} 🪙`, color: '#ffdd44' },
    ];
    ctx.save();
    ctx.textAlign = 'left';
    stats.forEach((s, i) => {
      const sy = panelY + panelH * (0.32 + i * 0.1);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = `${Math.floor(panelW * 0.07)}px Rajdhani, Rajdhani, Arial`;
      ctx.fillText(s.label, panelX + 20, sy);
      ctx.fillStyle = s.color;
      ctx.font = `bold ${Math.floor(panelW * 0.085)}px Orbitron, Orbitron, Arial`;
      ctx.textAlign = 'right';
      ctx.fillText(s.value, panelX + panelW - 20, sy);
      ctx.textAlign = 'left';
    });
    ctx.restore();

    if (score >= highScore && score > 0) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff8844';
      ctx.shadowBlur = 10; ctx.shadowColor = '#ff8844';
      ctx.font = `bold ${Math.floor(panelW * 0.08)}px Orbitron, Orbitron, Arial`;
      ctx.fillText('🏆 NOVO RECORDE!', panelX + panelW/2, panelY + panelH * 0.74);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Moedas permanentes
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,220,50,0.15)';
    roundRect(ctx, panelX + 12, panelY + panelH * 0.77, panelW - 24, 38, 8);
    ctx.fill();
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.floor(panelW * 0.1)}px Orbitron, Orbitron, Arial`;
    ctx.shadowBlur = 8; ctx.shadowColor = '#ffdd00';
    ctx.fillText(`🪙 ${permCoins}`, panelX + panelW/2, panelY + panelH * 0.8 + 14);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${Math.floor(panelW * 0.055)}px Rajdhani, Rajdhani, Arial`;
    ctx.fillText('moedas permanentes', panelX + panelW/2, panelY + panelH * 0.8 + 30);
    ctx.restore();

    // Botão jogar novamente
    const btnW = panelW - 24, btnH = 46;
    const btnX = panelX + 12, btnY = panelY + panelH * 0.87;
    const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
    btnGrad.addColorStop(0, '#226622');
    btnGrad.addColorStop(1, '#114411');
    ctx.fillStyle = btnGrad;
    roundRect(ctx, btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.floor(btnW * 0.12)}px Orbitron, Orbitron, Arial`;
    ctx.fillText('↺ JOGAR NOVAMENTE', btnX + btnW/2, btnY + btnH * 0.65);

    // ── Painel direito: loja de progressão ───────────────
    const shopX = panelX + panelW + W * 0.03;
    const shopW = W - shopX - W * 0.03;
    const shopY = panelY;
    const shopH = panelH;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(ctx, shopX, shopY, shopW, shopH, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(100,200,255,0.3)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, shopX, shopY, shopW, shopH, 14);
    ctx.stroke();
    ctx.restore();

    // Título da loja
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#88ccff';
    ctx.font = `bold ${Math.floor(shopW * 0.12)}px Orbitron, Orbitron, Arial`;
    ctx.shadowBlur = 12; ctx.shadowColor = '#44aaff';
    ctx.fillText('🔧 UPGRADES', shopX + shopW/2, shopY + shopH * 0.07);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = `${Math.floor(shopW * 0.065)}px Rajdhani, Rajdhani, Arial`;
    ctx.fillText('persistem entre partidas', shopX + shopW/2, shopY + shopH * 0.115);
    ctx.restore();

    // Linha divisória loja
    ctx.save();
    ctx.strokeStyle = 'rgba(100,200,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(shopX + 20, shopY + shopH * 0.135);
    ctx.lineTo(shopX + shopW - 20, shopY + shopH * 0.135);
    ctx.stroke();
    ctx.restore();

    // Cards dos perks
    const cardMargin = 8;
    const cardH2 = Math.min((shopH * 0.82 - cardMargin * (defs.length + 1)) / defs.length, 90);
    const cardW2 = shopW - cardMargin * 2;
    const cardsStartY = shopY + shopH * 0.15;

    defs.forEach((def, i) => {
      const level = Progression.getPerkLevel(def.id);
      const maxed = level >= def.maxLevel;
      const cost = maxed ? 0 : def.cost[level];
      const affordable = !maxed && permCoins >= cost;
      const cy = cardsStartY + i * (cardH2 + cardMargin);
      const cx3 = shopX + cardMargin;

      // Card background
      const isHover = shopHoverIdx === i;
      ctx.save();
      if (maxed) {
        ctx.fillStyle = 'rgba(30,80,30,0.6)';
      } else if (affordable) {
        ctx.fillStyle = isHover ? 'rgba(80,100,160,0.7)' : 'rgba(30,50,90,0.6)';
      } else {
        ctx.fillStyle = 'rgba(40,40,50,0.5)';
      }
      roundRect(ctx, cx3, cy, cardW2, cardH2, 8);
      ctx.fill();

      // Borda
      ctx.strokeStyle = maxed ? 'rgba(80,255,80,0.5)' : (affordable ? 'rgba(100,150,255,0.5)' : 'rgba(80,80,100,0.3)');
      ctx.lineWidth = 1.5;
      roundRect(ctx, cx3, cy, cardW2, cardH2, 8);
      ctx.stroke();
      ctx.restore();

      // Ícone
      ctx.save();
      ctx.font = `${Math.floor(cardH2 * 0.38)}px Rajdhani, Rajdhani, Arial`;
      ctx.textAlign = 'left';
      ctx.fillText(def.icon, cx3 + 10, cy + cardH2 * 0.62);
      ctx.restore();

      // Label + desc
      ctx.save();
      ctx.textAlign = 'left';
      ctx.fillStyle = maxed ? '#88ff88' : (affordable ? '#ffffff' : '#888899');
      ctx.font = `bold ${Math.floor(cardW2 * 0.085)}px Orbitron, Orbitron, Arial`;
      ctx.fillText(def.label, cx3 + cardH2 * 0.55, cy + cardH2 * 0.38);
      ctx.fillStyle = maxed ? '#55cc55' : 'rgba(180,180,200,0.7)';
      ctx.font = `${Math.floor(cardW2 * 0.065)}px Rajdhani, Rajdhani, Arial`;
      ctx.fillText(def.desc, cx3 + cardH2 * 0.55, cy + cardH2 * 0.62);
      ctx.restore();

      // Nível e custo
      ctx.save();
      ctx.textAlign = 'right';
      if (maxed) {
        ctx.fillStyle = '#44ff88';
        ctx.font = `bold ${Math.floor(cardW2 * 0.075)}px Orbitron, Orbitron, Arial`;
        ctx.fillText('MAX ✓', cx3 + cardW2 - 10, cy + cardH2 * 0.42);
      } else {
        // Custo
        ctx.fillStyle = affordable ? '#ffdd44' : '#884422';
        ctx.font = `bold ${Math.floor(cardW2 * 0.09)}px Orbitron, Orbitron, Arial`;
        ctx.shadowBlur = affordable ? 6 : 0; ctx.shadowColor = '#ffdd00';
        ctx.fillText(`🪙 ${cost}`, cx3 + cardW2 - 10, cy + cardH2 * 0.42);
        ctx.shadowBlur = 0;
      }
      // Barras de nível
      const barTotalW = Math.min(80, cardW2 * 0.35);
      const barH3 = 6;
      const barSpacing = barTotalW / def.maxLevel;
      for (let b = 0; b < def.maxLevel; b++) {
        const bx3 = cx3 + cardW2 - 10 - barTotalW + b * barSpacing;
        ctx.fillStyle = b < level ? (maxed ? '#44ff88' : '#4488ff') : 'rgba(255,255,255,0.15)';
        roundRect(ctx, bx3 + 1, cy + cardH2 * 0.65, barSpacing - 3, barH3, 2);
        ctx.fill();
      }
      ctx.restore();
    });
  }

  // Detectar clique na loja de upgrades e no botão restart
  function handleGameOverClick(x, y) {
    const panelW = Math.min(W * 0.44, 320);
    const panelX = W * 0.03;
    const panelY = H * 0.06;
    const panelH = H * 0.88;

    // Botão restart
    const btnW = panelW - 24, btnH = 46;
    const btnX = panelX + 12, btnY = panelY + panelH * 0.87;
    if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
      startGame();
      return;
    }

    // Loja de upgrades
    const shopX = panelX + panelW + W * 0.03;
    const shopW = W - shopX - W * 0.03;
    const shopH = panelH;
    const defs = Progression.getUnlockedPerks(Progression.getMaxPhaseReached());
    const cardMargin = 8;
    const cardH2 = Math.min((shopH * 0.82 - cardMargin * (defs.length + 1)) / defs.length, 90);
    const cardW2 = shopW - cardMargin * 2;
    const cardsStartY = panelY + shopH * 0.15;

    defs.forEach((def, i) => {
      const cy = cardsStartY + i * (cardH2 + cardMargin);
      const cx3 = shopX + cardMargin;
      if (x >= cx3 && x <= cx3 + cardW2 && y >= cy && y <= cy + cardH2) {
        if (Progression.canUpgrade(def.id, Progression.getMaxPhaseReached())) {
          Progression.buyUpgrade(def.id);
          Effects.floatText(x, y - 20, `${def.label} NÍVEL ${Progression.getPerkLevel(def.id)}!`, '#88ccff', 15);
        }
      }
    });
  }


  function togglePause(){
    if(state===STATE.PAUSED){state=pausedFromState||STATE.PLAYING;saveRun('resume');return;}
    if([STATE.PLAYING,STATE.BOSS_INTRO,STATE.PHASE_INTRO].includes(state)){pausedFromState=state;state=STATE.PAUSED;saveRun('pause');}
  }

  function menuLayoutV11(){

    const headerH = compact ? 100 : 126;
    const tabsH = compact ? 42 : 48;
    const actionH = compact ? 64 : 76;
    const gap = compact ? 8 : 12;
    const tabsY = m + headerH;
    const contentY = tabsY + tabsH + gap;
    const contentBottom = H - m - actionH - gap;
    const contentH = Math.max(150, contentBottom - contentY);
    const tabGap = 7;
    const tabW = (W - m*2 - tabGap*2)/3;
    const tabs = ['MISSÕES','OFICINA','AMEAÇA'].map((label,i)=>({label,x:m+i*(tabW+tabGap),y:tabsY,w:tabW,h:tabsH}));
    const actionY = H - m - actionH;
    const settingsW = compact ? 50 : 58;
    const actionGap = 8;
    const usableW = W - m*2 - settingsW - actionGap;
    const hasContinue = hasRunSave;
    const startW = hasContinue ? usableW*.55 : usableW;
    const continueW = hasContinue ? usableW-startW-actionGap : 0;
    const start = {x:m,y:actionY,w:startW,h:actionH};
    const cont = {x:m+startW+actionGap,y:actionY,w:continueW,h:actionH};
    const settings = {x:W-m-settingsW,y:actionY,w:settingsW,h:actionH};
    return {m,compact,headerH,tabsH,actionH,gap,tabsY,contentY,contentH,contentBottom,tabs,start,cont,settings};
  }

    rs.forEach((r,i)=>{const def=d.items[i],level=Progression.getPerkLevel(def.id),maxed=level>=def.maxLevel,cost=maxed?0:def.cost[level],aff=permCoins>=cost,isNew=phaseShopNewPerks.some(p=>p.id===def.id);panelV11(r.x,r.y,r.w,r.h,11,.80);if(isNew)glowLineV11(r.x+10,r.y+r.h-3,r.w-20,'#ffd65a');ctx.textAlign='left';ctx.font=`${Math.min(24,r.h*.36)}px Arial`;ctx.fillText(def.icon,r.x+10,r.y+r.h*.46);ctx.fillStyle=maxed?'#72f0ab':'#f0f5ff';ctx.font=`900 ${fitTextV11(def.label,r.w*.58,13,8)}px Orbitron,Arial`;ctx.fillText(def.label,r.x+44,r.y+r.h*.34);ctx.fillStyle='#8394aa';ctx.font=`700 ${fitTextV11(def.desc,r.w*.62,11,8,'Rajdhani')}px Rajdhani,Arial`;ctx.fillText(def.desc,r.x+44,r.y+r.h*.62);ctx.textAlign='right';ctx.fillStyle=maxed?'#72f0ab':aff?'#ffd65a':'#9a5a63';ctx.font=`900 ${Math.max(9,Math.min(12,r.h*.18))}px Orbitron,Arial`;ctx.fillText(maxed?'MAX':`◈ ${cost}`,r.x+r.w-10,r.y+r.h*.36);ctx.fillStyle='#62748c';ctx.font='800 8px Orbitron,Arial';ctx.fillText(`NV ${level}/${def.maxLevel}`,r.x+r.w-10,r.y+r.h*.66);});
    if(d.pages>1){ctx.textAlign='center';ctx.fillStyle='#7c8ea7';ctx.font='800 9px Orbitron,Arial';ctx.fillText(`‹  PÁGINA ${phaseShopPageV12+1}/${d.pages}  ›`,W/2,H-l.footerH-7);}
    const b=l.button,gg=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y);gg.addColorStop(0,'#b62f09');gg.addColorStop(1,'#ff7924');ctx.fillStyle=gg;ctx.shadowBlur=16;ctx.shadowColor='rgba(255,80,20,.45)';roundRect(ctx,b.x,b.y,b.w,b.h,12);ctx.fill();ctx.shadowBlur=0;ctx.textAlign='center';ctx.fillStyle='#fff';const label=isFromMenu?'VOLTAR AO MENU':`INICIAR FASE ${phaseNum} • ${nextPhaseDef.icon}`;ctx.font=`900 ${fitTextV11(label,b.w-24,W<600?13:16,9)}px Orbitron,Arial`;ctx.fillText(label,b.x+b.w/2,b.y+b.h*.60);
  }
  function handlePhaseShopClick(x,y){const isFromMenu=(vehicle==null||vehicle.dead),d=phaseShopDataV12(),l=phaseShopLayoutV12(d.items.length),rs=phaseShopRectsV12(l,d.items.length);if(inRect(x,y,l.button)){if(isFromMenu)state=STATE.MENU;else continuePhase();return;}for(let i=0;i<rs.length;i++)if(inRect(x,y,rs[i])){if(Progression.canUpgrade(d.items[i].id,d.maxP)){Progression.buyUpgrade(d.items[i].id);GameAudio.event('upgrade');}return;}if(d.pages>1&&y>H-l.footerH-30&&y<H-l.footerH+8){if(x<W/2)phaseShopPageV12=Math.max(0,phaseShopPageV12-1);else phaseShopPageV12=Math.min(d.pages-1,phaseShopPageV12+1);}}

  // ── Helpers de texto ──────────────────────────────────────
  function wrapText(ctx, text, x, y, maxW, lineH) {
    const words = text.split(' ');
    let line = '';
    for (const word of words) {
      const test = line + word + ' ';
      if (ctx.measureText(test).width > maxW && line !== '') {
        ctx.fillText(line, x, y);
        line = word + ' ';
        y += lineH;
      } else {
        line = test;
      }
    }
    ctx.fillText(line, x, y);
  }

  // Inicializa
  resize();
})();
