<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>As Aventuras de João e Crist — Edição Livro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at center,#3a3027 0,#1c1815 55%,#0c0a09 100%);
font-family:Georgia,"Times New Roman",serif;color:#fff}
.reader{height:100vh;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;justify-content:center;gap:20px;
background:rgba(8,7,6,.72);border-bottom:1px solid #ffffff18;backdrop-filter:blur(8px);z-index:10}
.title{font-size:16px;letter-spacing:.5px}.counter{font-size:13px;opacity:.65}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;
padding:25px 75px 70px;perspective:2400px}
.book{height:min(80vh,820px);max-width:min(91vw,1180px);display:flex;justify-content:center;
align-items:stretch;filter:drop-shadow(0 25px 30px #0009);transform-style:preserve-3d}
.page{height:100%;aspect-ratio:419.25/595.5;background:#f7f0e3;overflow:hidden;position:relative}
.page img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
.left{border-radius:5px 0 0 5px;box-shadow:inset -14px 0 20px #00000014}
.right{border-radius:0 5px 5px 0;box-shadow:inset 14px 0 20px #00000014}
.single{border-radius:5px;box-shadow:0 0 0 1px #0002,inset 0 0 28px #00000013}
.gutter{width:13px;flex:0 0 13px;background:linear-gradient(90deg,#0003,#fff3,#0003);z-index:3}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:54px;height:54px;
border-radius:50%;border:1px solid #ffffff2b;background:#0e0c0bb8;color:#fff;font-size:34px;
cursor:pointer;box-shadow:0 8px 24px #0005;transition:.15s}
.nav:hover{transform:translateY(-50%) scale(1.06);background:#332b24}
.nav:disabled{opacity:.22;cursor:default}.prev{left:14px}.next{right:14px}
.help{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);z-index:20;
font:12px Arial,sans-serif;background:#090806aa;border:1px solid #ffffff18;padding:8px 13px;
border-radius:999px;opacity:.8}
.flip{animation:flip .42s ease}
@keyframes flip{0%{transform:rotateY(0)}45%{transform:rotateY(-10deg) scaleX(.985)}
100%{transform:rotateY(0)}}
@media(max-width:760px){.top{height:50px}.title{font-size:13px}.stage{padding:10px 50px 55px}
.book{height:min(77vh,700px)}.gutter{width:8px;flex-basis:8px}.nav{width:44px;height:44px;font-size:27px}
.prev{left:5px}.next{right:5px}.help{font-size:10px}}
</style>
</head>
<body>
<div class="reader">
<div class="top"><div class="title">As Aventuras de João e Crist</div><div id="counter" class="counter"></div></div>
<div class="stage">
<button id="prev" class="nav prev" aria-label="Página anterior">‹</button>
<div id="book" class="book"></div>
<button id="next" class="nav next" aria-label="Próxima página">›</button>
<div class="help">← → virar página • clique nas setas</div>
</div>
</div>
<script>
const spreads = [{"left": null, "right": 1}, {"left": 2, "right": 3}, {"left": 4, "right": 5}, {"left": 6, "right": 7}, {"left": 8, "right": 9}, {"left": 10, "right": 11}, {"left": 12, "right": 13}, {"left": 14, "right": 15}, {"left": 16, "right": 17}, {"left": 18, "right": 19}, {"left": 20, "right": 21}, {"left": 22, "right": 23}, {"left": 24, "right": 25}, {"left": 26, "right": 27}, {"left": 28, "right": 29}];
let current=0;
const book=document.getElementById('book'),counter=document.getElementById('counter');
const prev=document.getElementById('prev'),next=document.getElementById('next');

function makePage(n,side){
  const p=document.createElement('div'); p.className='page '+side;
  if(!n){p.style.visibility='hidden';return p}
  if(current===0)p.classList.add('single');
  const img=document.createElement('img');
  img.src='pages/pagina-'+String(n).padStart(2,'0')+'.jpg';
  img.alt='Página '+n; p.appendChild(img); return p;
}
function render(anim=true){
  const s=spreads[current]; book.innerHTML='';
  if(s.left===null){book.appendChild(makePage(s.right,'single'))}
  else{
    book.appendChild(makePage(s.left,'left'));
    const g=document.createElement('div');g.className='gutter';book.appendChild(g);
    if(s.right)book.appendChild(makePage(s.right,'right'));
  }
  if(anim){book.classList.remove('flip');void book.offsetWidth;book.classList.add('flip')}
  const first=s.left===null?s.right:s.left, last=s.right||s.left;
  counter.textContent=(first===last?'página '+first:'páginas '+first+'–'+last)+' / '+29;
  prev.disabled=current===0; next.disabled=current===spreads.length-1;
}
function go(delta){const n=current+delta;if(n<0||n>=spreads.length)return;current=n;render(true)}
prev.onclick=()=>go(-1); next.onclick=()=>go(1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}
  if(e.key==='Home'){e.preventDefault();current=0;render(true)}
  if(e.key==='End'){e.preventDefault();current=spreads.length-1;render(true)}
});
let sx=null;
book.addEventListener('pointerdown',e=>{sx=e.clientX});
book.addEventListener('pointerup',e=>{
  if(sx===null)return; const dx=e.clientX-sx;sx=null;
  if(Math.abs(dx)>45)go(dx<0?1:-1);
});
render(false);
</script>
</body>
</html>
